name: R Tests

on:
  push:
  pull_request:

jobs:
  r-tests:
    runs-on: ubuntu-latest
    env:
      SKIP_DATA_DOWNLOADS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          # Precompiled Linux binaries, as r-ci.yml already uses. Installing from
          # cloud.r-project.org meant building every package from source, and the runner
          # carries no libuv or libcurl headers, so 'fs' and 'curl' failed to configure and
          # took pkgload -> testthat and sass -> bslib -> shiny down with them.
          use-public-rspm: true

      # install.packages() only warns on failure and still exits 0, so a broken install used
      # to surface much later as "there is no package called 'testthat'" in the run step.
      # Verify every package is loadable and fail here instead.
      - name: Install dependencies
        run: |
          Rscript -e 'packages <- c("testthat","yaml","dplyr","tibble","stringr","tidyr","purrr","shiny","bslib","scales","countrycode","readr","curl","jsonlite"); if (file.exists("DESCRIPTION")) packages <- c(packages, "devtools"); packages <- unique(packages); install.packages(packages); missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing) > 0) stop("dependency install failed for: ", paste(missing, collapse = ", "))'

      - name: Run tests
        run: |
          if [ -f DESCRIPTION ]; then
            R -q -e "devtools::test()"
          else
            R -q -e "testthat::test_dir('tests/testthat')"
          fi
