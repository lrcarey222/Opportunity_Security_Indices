name: Datawrapper Charts

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset to export to Datawrapper."
        required: true
        type: choice
        options:
          - energy_security_category_scores
          - energy_security_category_contributions
          - energy_security_variable_contributions
          - energy_security_index
          - economic_opportunity_category_scores
          - economic_opportunity_category_contributions
          - economic_opportunity_variable_contributions
          - economic_opportunity_index
      chart_id:
        description: "Datawrapper chart ID to update."
        required: true
        type: string
      outputs_rds_path:
        description: "Path to RDS file containing index outputs."
        required: true
        default: "datawrapper_outputs.rds"
        type: string
      build_outputs:
        description: "Build outputs from pipeline before updating charts."
        required: true
        default: false
        type: boolean
      countries:
        description: "Comma-separated list of countries to include (blank for all)."
        required: false
        type: string
      tech:
        description: "Comma-separated list of tech values to include (blank for all)."
        required: false
        type: string
      supply_chain:
        description: "Comma-separated list of supply chain values to include (blank for all)."
        required: false
        type: string
      categories:
        description: "Comma-separated list of categories to include (blank for all)."
        required: false
        type: string
      variables:
        description: "Comma-separated list of variables to include (blank for all)."
        required: false
        type: string
      publish:
        description: "Publish chart after upload."
        required: true
        default: true
        type: boolean

jobs:
  datawrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install Datawrapper dependencies
        run: |
          Rscript -e 'install.packages(c("dplyr","readr","stringr","httr2","rprojroot"), repos="https://cloud.r-project.org")'

      - name: Install pipeline dependencies (optional)
        if: ${{ inputs.build_outputs }}
        run: |
          Rscript -e 'install.packages(c("yaml","tidyr","readxl","tibble","purrr","glue","rlang","countrycode","WDI","comtradr","magrittr"), repos="https://cloud.r-project.org")'

      - name: Build outputs (optional)
        if: ${{ inputs.build_outputs }}
        run: |
          Rscript -e "source('scripts/00_setup.R'); source('scripts/05_ingest_sources.R'); source('scripts/07_process_data.R'); source('scripts/10_build_themes.R'); source('scripts/20_build_indices.R'); saveRDS(list(energy_security_outputs=energy_security_outputs, economic_opportunity_outputs=economic_opportunity_outputs), '${{ inputs.outputs_rds_path }}')"

      - name: Update Datawrapper chart
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
          OPSI_DW_DATASET: ${{ inputs.dataset }}
          OPSI_DW_CHART_ID: ${{ inputs.chart_id }}
          OPSI_OUTPUTS_RDS: ${{ inputs.outputs_rds_path }}
          OPSI_DW_COUNTRIES: ${{ inputs.countries }}
          OPSI_DW_TECH: ${{ inputs.tech }}
          OPSI_DW_SUPPLY_CHAIN: ${{ inputs.supply_chain }}
          OPSI_DW_CATEGORIES: ${{ inputs.categories }}
          OPSI_DW_VARIABLES: ${{ inputs.variables }}
          OPSI_DW_PUBLISH: ${{ inputs.publish }}
        run: |
          Rscript -e "source('scripts/datawrapper_api.R'); source('scripts/datawrapper_charts.R'); run_datawrapper_charts()"
