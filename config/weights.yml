energy_security:
  Foreign Dependency: 6
  Energy Imports: 4
  Reserves: 4
  Trade: 4
  Minerals Trade: 4
  Production: 6
  Energy Access: 4
  Consumption: 5
  Energy Prices: 2
  Investment: 3

economic_opportunity:
  Trade: 3
  Production: 3
  Technology Demand: 4
  Technological Readiness: 2
  Energy Prices: 3
  Investment: 3
  Energy Access: 3
  Foreign Dependency: 3
  Cost Competitiveness: 3
  Consumption: 3

# Partner-level PSI category weights (scripts/25). A partner is scored on the categories it has,
# weights renormalized: development is defined only for non-high-income partners, so a
# high-income partner's PSI is (0.4 FS + 0.4 OP) / 0.8.
psi:
  friendshore: 0.4
  opportunity: 0.4
  development: 0.2

partnership_opportunity_components:
  trade_index: 3
  econ_opp_index: 3
  # The partner market's energy-security NEED (1 - its ES rank); formerly energy_security_index.
  partner_es_need: 1
  climate_policy_weight: 0.05

partnership_friendshore_components:
  imp_trade_index: 2
  econ_opp_raw: 0
  es_need: 2
  eo_partner: 2
  outbound_index: 2
  # Probability that reporter and partner sit in the same US-China bloc of UNGA voting
  # (data/processed/geo_alignment_tbl.rds, scripts/12; settings in config/geopolitical_distance.yml
  # alignment). Hard blocs by default: 1 same bloc, 0 opposite blocs, 0.5 when either is
  # nonaligned. Territories and SARs take their sovereign's bloc and Taiwan, Palestine and Kosovo
  # are neutral (data/reference/territory_sovereign_map.csv). A dyad without a value is dropped
  # from the weighted mean, not scored 0.
  geo_alignment: 2

# Development potential (partner-level, non-high-income partners). These were hard-coded in
# stronger_development.R; the US-EO term that had weight 1.5 there has been dropped.
partnership_development_components:
  development_index: 1
  doingbusiness_index: 1
  investment_enviro_index: 1
  energy_security: 1
  economic_opportunity: 1.5
  aid_index_supplychain: 1.5
  aidgdp_index_supplychain: 2
  energy_use_index: 1
