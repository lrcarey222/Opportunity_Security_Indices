# AIB taxonomy overlay: the electro-industrial HS6 dictionary (data/reference/electro_industrial_hs6_dictionary.csv;
# docs/electro_industrial_dictionary/README.md), RMI's Electro-Industrial Stack: 6 indices > 39 sectors > HS6,
# each code with one stage and one primary row. The default node source of the AIB since 2026-10-19. Read by
# scripts/31 and 32 on top of config/aib.yml when `taxonomy: dictionary`; every key here replaces the same
# key of config/aib.yml.

# Nodes: tech = EIS sector, supply_chain = stage, sub_sector = the sector, refined by `splits` (a split
# matches a sector and stage; codes no part lists go to `rest`, which also names a cell that is not split).
# The splits keep the chain steps the compacts and the physical constraint need apart (rare-earth oxides
# vs metals, lithium vs nickel vs cobalt, wafers vs gallium, GOES vs NGO steel, Li-ion vs other cells).
# scope: core (the headline: 182 codes, dedicated or predominant (specificity 1-2) plus 12 shared codes kept as core with a justification) or extended (core + extended, 318 codes; a
# sensitivity; --dictionary-scope overrides it). primary_only: each code in its primary sector only, so
# nothing is counted twice. Codes not in the OSI basket get neutral Export Opportunity, Friendshore and
# policy-compatibility scores (those indices are kept by OSI technology x stage; aib_osi_crosswalk()).
nodes:
  source: dictionary
  dictionary:
    file: electro_industrial_hs6_dictionary.csv
    scope: core
    primary_only: true
  osi_crosswalk_min_share: 0.2
  splits:
    - tech: "Critical minerals"
      supply_chain: Midstream
      optional: true
      into:
        - sub_sector: "PGMs (iridium, ruthenium)"
          hs6: ["711041"]
        - sub_sector: "Silver powder"
          hs6: ["710610"]
      rest: "Other critical minerals"
    - tech: "Critical minerals"
      supply_chain: Upstream
      optional: true
      rest: "Critical-mineral ores"
    - tech: "Battery minerals/refining"
      supply_chain: Upstream
      optional: true
