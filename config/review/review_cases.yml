    sector_groups: [critical-minerals, electric-vehicles, wind]
    country_groups: []
    stage: Components
    assignment_group: critical-minerals
    anchor: false
    why_selected: "Central to NEIS: China supplies 61.7% of allied traded demand (US$3.33bn of US$5.39bn is lost); after redistributed trade a 60.7% gap remains, and every variant (China halved, release, conservative, trade-only, every growth bound) gives the same class. There are no physical production data for the node (trade only)."
