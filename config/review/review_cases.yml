    why_selected: "Central NEIS pair and the only memo shipped in main's partnership data: rules-generated, not independently verified, generated 2026-11-06 on data as of 2026-10-30 (older than main's posture and AIB bundles of 2026-11-17). Its build-together list includes joint natural graphite, where both economies are Partner in battery-mineral extraction with no measured world share, and polysilicon (US to Japan), a node the AIB stress test rates LOW INTERVENTION while flagging China's 97% of operational capacity. Re-posed in UX v2 as one question the memo answers (what leads the cooperation), with the memo's four boxes as the options; the memo's headline box is always its joint-build list."
