  # AIB nodes (Sector review: one product under one stress)
  - case_id: CASE_014
    kind: aib_node
    key: {node: rare-earth-permanent-magnets, scenario: decoupling}
    title: "Rare-earth permanent magnets if China's supply is cut off"
    question: "If China stopped supplying rare-earth permanent magnets to allied economies, what kind of allied response would be needed?"
    brief:
      decision_question: "If China stopped supplying rare-earth permanent magnets to the 59 allied economies (while still buying from them), what kind of allied response would be needed: new production capacity, coordinated trade, managed reliance on a few suppliers with backup, or little intervention?"
      decision_context: "This approximates a joint decision by allied economic-security and trade officials about one product group. It asks whether existing trade could absorb the shock, or whether coordination or new capacity is needed. It reads traded supply only and is immediate: it does not model how long new plants take, prices or firm-level constraints."
