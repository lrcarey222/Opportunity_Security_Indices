  - case_id: CASE_021
    kind: partnership
    key: {pair: USA_JPN}
    title: "United States and Japan: clean-energy supply-chain cooperation"
    question: "What should lead cooperation between the United States and Japan on clean-energy supply chains over the next 12 to 36 months?"
    brief:
      decision_question: "Over the next 12 to 36 months, what should lead cooperation between the United States and Japan on clean-energy supply chains: new production capacity built jointly on specific steps, recognising each other as trusted suppliers and aligning trade rules, upgrading the agreements they already have, or no new joint commitments?"
      decision_context: "This approximates the agenda of a bilateral economic-security dialogue. The aim is joint resilience and industrial value where one side's strengths meet the other's needs; diplomatic closeness alone does not count, and two strong competitors are not complementary. The evidence below compares the two economies step by step; the analysis does not assess firms' commercial interest or the politics of a deal."
      objective: "Joint resilience and industrial value where one side's strengths meet the other's needs, not diplomatic goodwill."
    sector_groups: [batteries, critical-minerals, solar, semiconductors, wind]
    country_groups: [USA, JPN]
    stage: null
    assignment_group: partnerships
