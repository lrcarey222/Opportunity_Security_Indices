# Review case catalogue of the AIB Explorer expert peer review (docs/QC_SYSTEM_DESIGN.md 4.2).
# Each entry under `cases:` maps 1:1 to CaseDefinition in dashboard/src/review/model.ts. The snapshot a reviewer
# sees (the exact values), its hash and the answer options are built from the shipped bundles by
# dashboard/scripts/review/build-review-data.mjs; nothing numeric here is read by the build. Numbers quoted in
# why_selected were read from main's shipped bundles (posture 2026-11-17T20:33 @0496e7ba, posture-core.f665dc19;
# AIB 2026-11-17, compacts.c5643da1; partnership memo USA_JPN generated 2026-11-06) to explain the pick only.
#
# Rules:
# - case_id is stable and never reused. Retire a case by dropping it from a campaign's case_ids, never by
#   renumbering or by reusing its ID for another cell.
# - context_fields are shown before the blind answer and must never name a revealing fact id (choice, fence,
#   posture, reason, confidence, borderline, partner, policy_alignment, class, decision, missions,
#   choices_summary, headline). Model scores that decide the conclusion (need, prize, cp, the need-family
#   percentiles, pathway, deployment_need, coverage after coordination) are also held back for the reveal so
#   the blind answer is the reviewer's own reading of the evidence, not of the model's scores. The one
#   exception is a Deployment cell (CASE_012), whose only context fact is the deployment position (cp), which
#   the Deployment rule does not read.
# - reveal_fields name only facts the bundle carries for that case (the builder writes a missing fact as null
#   with a note, so a fact that is always null for a case, e.g. partner on a Preserve cell, is left out).
# - sector_groups use the shared sector tags, country_groups ISO3 codes, stage one of the six stage tags.
# - explorer_path is a deep link into main's app (dashboard/src/routes.tsx and the module routes.tsx):
#   /countries/:iso3?node=Tech|Stage (Country profile, cell drawer; posture/selection.ts NODE_KEY);
#   an AIB node opens its operational compact's node list, /compacts/AIB-Cxx[?scn=decoupling]#nodes, as the
#   Overview's own node links do (aib/views/AibOverviewView.tsx), or the Workstreams node list
#   /compacts/workstreams[?scn=decoupling]#nodes for a node without a compact, or /aib/diversification for
#   the Managed Interdependence view; /compacts/s/:sid[?scn=decoupling] for a strategic compact;
#   /aib/partnerships?country=A&partner=B for a pair (aib/nav.ts pairHref). Managed Interdependence is the
#   default scenario and is never written to the URL (aib/scenarioUrl.ts); scn=decoupling is.

