# Review case catalogue of the AIB Explorer expert peer review (docs/QC_SYSTEM_DESIGN.md 4.2; UX v2,
# docs/QC_UX_REVIEW.md and docs/qc_audit/QC_EVIDENCE_CATALOGUE.md).
# Each entry under `cases:` maps 1:1 to CaseDefinition in dashboard/src/review/model.ts. The snapshot a reviewer
# sees (the exact values), the neutral case brief, the reasoning reveal, the snapshot hash and the answer options
# are built from the shipped bundles by dashboard/scripts/review/build-review-data.mjs; nothing numeric here is
# read by the build. Numbers quoted in why_selected were read from main's shipped bundles (posture
# 2026-11-17T20:33 @0496e7ba, posture-core.f665dc19; AIB 2026-11-17, compacts.c5643da1; partnership memo USA_JPN
# generated 2026-11-06) to explain the pick only.
#
# Rules:
# - case_id is stable and never reused. Retire a case by dropping it from a campaign's case_ids, never by
#   renumbering or by reusing its ID for another cell. New cases take the next free number (CASE_022 ...).
# - brief: (UX v2) the authored part of the neutral case brief shown BEFORE the blind answer:
#   decision_question (one decision, in plain words, with its horizon), decision_context (2-3 sentences: whose
#   decision this approximates, the objective, what the analysis does and does not determine), objective, and
#   optionally time_horizon (overrides the builder's), evidence_ids (5-8 brief fact ids, qc/brief.ts
#   BRIEF_FACT_IDS_BY_KIND) and assumption_ids (qc/brief.ts ASSUMPTIONS). The builder adds the true horizon and
#   scenario, the six-stage strip, the evidence facts, warnings, missing evidence and definitions. Brief text,
#   titles and questions must never name a conclusion (no choice, class, decision or memo-box label, no
#   "posture", "fence", "coercive", "large yard", no model score): the validator and the build lint them
#   (qc/briefLint.ts) and fail on a leak.
# - context_fields are snapshot facts shown before the blind answer and must never name a revealing fact id
#   (choice, fence, posture, reason, confidence, borderline, partner, policy_alignment, class, decision, missions,
#   choices_summary, headline, lead_stage, explorer_stages, node_classes). Model scores that decide the
#   conclusion (need, prize, cp, the need-family percentiles, pathway, deployment_need, coverage after
#   coordination) and model outputs that presuppose or reveal it (the AIB physical_warning, which fires only for
#   some classes; the compact purpose, non_allied_relied_on and critical_external) are reveal-only.
# - reveal_fields name only facts the bundle carries for that case.
# - sector_groups use the shared sector tags, country_groups ISO3 codes, stage one of the six stage tags.
# - explorer_path is a deep link into main's app (dashboard/src/routes.tsx and the module routes.tsx):
#   /countries/:iso3?node=Tech|Stage (Country profile, cell drawer; posture/selection.ts NODE_KEY);
#   an AIB node opens its operational compact's node list, /compacts/AIB-Cxx[?scn=decoupling]#nodes, as the
#   Overview's own node links do (aib/views/AibOverviewView.tsx), or the Workstreams node list
#   /compacts/workstreams[?scn=decoupling]#nodes for a node without a compact, or /aib/diversification for
#   the Managed Interdependence view; /compacts/s/:sid[?scn=decoupling] for a strategic compact or a sector
#   chain; /aib/partnerships?country=A&partner=B for a pair (aib/nav.ts pairHref). Managed Interdependence is
#   the default scenario and is never written to the URL (aib/scenarioUrl.ts); scn=decoupling is.

