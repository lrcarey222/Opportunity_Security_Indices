  - case_id: CASE_001
    kind: posture_cell
    key: {iso3: KOR, tech: Batteries, stage: Components}
    title: "Korea: battery component manufacturing"
    question: "How should South Korea manage battery component manufacturing through 2035?"
    brief:
      decision_question: "How should South Korea manage battery component manufacturing through 2035?"
      decision_context: "This approximates a call by South Korea's industrial-strategy and economic-security officials about one step of the battery supply chain: protect it, keep and strengthen it, build it up, rely on trusted partners or diversified suppliers, or leave it to the open market. Relying on partners or leaving supply open can be the best outcome. The analysis does not assess individual firms, programme costs or policy instruments."
      objective: "Resilient and affordable supply, not maximum national self-sufficiency."
    sector_groups: [batteries, electric-vehicles]
    country_groups: [KOR]
    stage: Components
    assignment_group: batteries
    anchor: true
    why_selected: "Central to NEIS and near a threshold: Preserve with Competitive Position 0.763 against the 0.75 bar (Catch Up is the other possible choice); the node has 19 contenders, so one rank step moves the position by 0.053. Korea holds 6.2% of world supply and an export RCA of 3.48, with China 76.6% of its imports."
    explorer_path: "/countries/KOR?node=Batteries|Components"
    context_fields: [home_share, imports_to_gdp, top_supplier, top_supplier_share, china_share, coercive_import_share, trusted_share, benchmark_share, benchmark_rca, benchmark_exports, export_trend, demand_outlook]
    reveal_fields: [choice, posture, fence, reason, confidence, borderline, need, prize, market, cp, pathway, large_yard_signals, import_dependence, import_hhi, china_bloc, trusted_alternatives, policy_alignment, coercive_top, coercive_top_share, opposite_bloc_share, outlook, prize_note]
    decision_use: true

