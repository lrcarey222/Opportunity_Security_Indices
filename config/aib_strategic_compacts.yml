# AIB Strategic Sectoral Compacts: the institutional layer above the compact workstreams
# (docs/aib_methodology.md). Read by scripts/33_build_aib_strategic_layer.R; the functions are in
# R/aib/aib_strategic.R (pure).
#
# WHAT THIS IS. A strategic compact is a persistent institutional framework around one physically or
# economically coherent value chain, whose nodes may need different partners, different policies
# (BUILD / COORDINATE / MANAGE SPECIALIZATION / LOW INTERVENTION) and different forms of coordination.
# The compact candidates of scripts/32 (AIB-C01..., 28 in the run of 2026-10-21, grouped by partner overlap, policy similarity and
# chain coherence) become the WORKSTREAMS inside these compacts. Each workstream belongs to exactly one
# compact (see WORKSTREAMS below).
#
# HOW IT WAS MADE. This mapping is CURATED, NOT DISCOVERED. It was written by hand from industrial-
# process knowledge, starting from:
#   * the electro-industrial dictionary's index > sector > stage structure
#     (data/reference/electro_industrial_hs6_dictionary.csv; the node ids are the sub-sectors built by
#     config/aib_taxonomy_dictionary.yml `splits`);
#   * the curated `supply_chain_links` and `material_links` in config/aib_taxonomy_dictionary.yml.
# No clustering, partner similarity or optimisation result decides which compact a node belongs to:
# physically linked nodes stay in one compact even when their best partners differ. Where a chain had
# to be cut (an assembled product takes inputs from several chains), it is cut at the integration
# step and the cut is recorded. Every judgement call, with the alternative that was rejected, is in
# `mapping_notes`; the cross-compact workstreams are in `workstream_overrides`. Edit freely; scripts/33
# validates the file.
#
# IDENTICAL IN EVERY SCENARIO. The compacts, their steps and the node mapping do not depend on the
# scenario (baseline, Managed Interdependence, partial disruption, Decoupling). A scenario changes
# which nodes are active priorities and their policy class, never which compact a node belongs to.
#
# ABSENT CLASSES AND EMPTY COMPACTS MUST BE RENDERED, NOT HIDDEN.
#   * Decoupling has no MANAGE SPECIALIZATION node (2026-10-20 run, 77 nodes: 42 BUILD, 2 COORDINATE,
#     30 LOW INTERVENTION, 3 INSUFFICIENT DATA). Every compact's MANAGE count is 0 there; the portfolio
#     and missions show the zero rather than dropping the class.
#   * Some compacts have no active workstream. SC-NUCLEAR has no workstream at all in the Decoupling
#     clustering (every nuclear node is LOW INTERVENTION or INSUFFICIENT DATA), and under Managed
#     Interdependence some compacts have no workstream with an active node. Cards,
#     spines and matrices show these compacts with zero counts and empty workstream lists.
#   * Demand-weighted compact figures are dominated by one large node in two compacts: integrated
#     circuits are about 70% of SC-SEMIS demand and the conductor metals (copper ore, refined copper,
#     copper and aluminium wire rod) about 65% of SC-GRID demand, all LOW INTERVENTION under Decoupling. Read those compacts' headline coverage
#     with their BUILD nodes, not instead of them.
#
# SCHEMA
#   compacts[]                  ordered as they should be listed
#     strategic_compact_id      stable id, "SC-" prefix; never reuse an id for a different chain
#     strategic_compact_name    display name
#     family                    optional grouping of compacts for display
#     purpose                   one sentence: why the compact exists
#     value_chain[]             the physically ordered chain, upstream first. An input sits one step
#                               before the stage that consumes it (silver paste beside wafers, cover
#                               glass beside cells, fab equipment before chips).
#       value_chain_order       integer; strictly increasing within a compact; nodes in one step share it
#       step                    short plain label for the supply-chain spine
#       description             one line for tooltips
#       nodes                   node ids of the core scope (the headline)
#       extended_nodes          optional: node ids that exist only in the extended dictionary scope
#   unmapped[]                  nodes deliberately in no strategic compact, each with a reason
#   workstream_overrides[]      workstreams whose nodes span two compacts, with the primary compact
#                               chosen on industrial logic (see WORKSTREAMS)
#   mapping_notes               node id -> why it sits where it does; judgement calls name the rejected
#                               alternative ("Alternative: ...") so the choice can be revisited
#
# WORKSTREAMS (scripts/33)
#   * A workstream (AIB-Cxx) maps to exactly ONE strategic compact, its primary compact.
#   * Default rule: the compact holding most of the workstream's allied demand; the share is recorded.
#   * `workstream_overrides` take precedence. An override is matched by its `nodes`: it applies to the
#     workstream whose node set equals that list, whatever its id (`workstream_id` records the id it
#     was written against; the ids come from the Decoupling clustering and a rerun may renumber them).
#     If no workstream has exactly those nodes, the override is stale: scripts/33 reports it and uses
#     the default rule.
#   * `also_spans` lists the other compacts a workstream touches, for an "also touches" link on those
#     compacts' cards and spines. For a straddling workstream without an override, scripts/33 derives
#     also_spans from node membership and flags the workstream for review.
#
# VALIDATION CONTRACT (scripts/33)
#   * Every node of the run must be mapped to exactly one compact and step, or be listed in `unmapped`.
#   * A listed id that is not a node of the run is not an error: it is an extended-scope node in a core
#     run, or a sub-sector merged into an aggregated node by the data-quality step.
#   * An aggregated node ("<tech>-<stage>--aggregated") listed here uses its listed step; one that is not
#     listed takes the compact and step of its member sub-sector with the largest allied demand (its
#     members are recorded in the inputs' `aggregated_into`), and scripts/33 reports it.
#   * A step with no node in the run is left off the spine.
#   * Every compact in `workstream_overrides` (primary_compact, also_spans) must exist in `compacts`.
#
# COVERAGE (core scope, 78 sub-sectors; 77 nodes in the 2026-10-20 run, where uranium ores and spent
# fuel & nuclear scrap are merged into uranium-fuel-upstream--aggregated): 10 compacts holding 77
# sub-sectors (76 run nodes), 1 unmapped (biofuels & wood pellets). Extended scope adds 20 nodes: 17
# mapped, 3 unmapped. In the 2026-10-21 run 3 of the 28 workstreams straddle two compacts: one (sensors
# with wafers) carries an override, the other two follow the demand rule; the other 25 lie wholly inside
# one compact. Workstream ids and groupings come from scripts/32's clustering and can change between runs;
# scripts/33 reports an override whose node set no longer matches as stale.

taxonomy: dictionary

compacts:

  # ---- Electrotechnology supply chains ----------------------------------------------------------

  - strategic_compact_id: SC-MAGNETS
    strategic_compact_name: "Permanent Magnets & Drive Systems"
    family: "Electrotechnology supply chains"
    purpose: "Secure the rare-earth chain from ore through separation, metal and magnet making, with the electrical steel and parts that go with it, to the motors and generators that drive vehicles, heat pumps, industry and wind turbines."
    value_chain:
      - value_chain_order: 1
        step: "Rare-earth ore"
        description: "Monazite and other rare-earth-bearing concentrates"
        nodes: [rare-earth-ores-monazite]
      - value_chain_order: 2
        step: "Separated oxides"
        description: "Separated rare-earth oxides and compounds (NdPr, Dy, Tb)"
        nodes: [rare-earth-oxides-and-compounds]
      - value_chain_order: 3
        step: "Metals & alloys"
        description: "Rare-earth metals and alloys reduced from the oxides"
        nodes: [rare-earth-metals]
      - value_chain_order: 4
        step: "Magnets & core steel"
        description: "Permanent magnets (NdFeB, SmCo, ferrite) and non-oriented steel for motor laminations (extended scope adds cold isostatic presses for sintered magnets)"
        nodes: [rare-earth-permanent-magnets, ferrite-and-other-magnets, non-oriented-electrical-steel-ngo]
        extended_nodes: [magnet-assemblies]
      - value_chain_order: 5
        step: "Motor & generator parts"
        description: "Stators, rotors and other parts of motors and generators"
        nodes: [motor-and-generator-parts]
      - value_chain_order: 6
        step: "Motors & generators"
        description: "Electric motors and AC generators"
        nodes: [electric-motors, ac-generators]

  - strategic_compact_id: SC-BATTERIES
    strategic_compact_name: "Battery Materials & Cells"
    family: "Electrotechnology supply chains"
    purpose: "Build an allied battery chain from mined and recycled minerals through refined chemicals, cathode and anode materials and cell components to cells and packs."
    value_chain:
      - value_chain_order: 1
        step: "Minerals & recycled feed"
        description: "Lithium and cobalt concentrates, natural graphite and battery scrap (extended scope adds nickel ores and black mass)"
        nodes: [lithium-minerals, cobalt-ores, natural-graphite, battery-recycling-feed]
        extended_nodes: [other-battery-mineral-ores]
      - value_chain_order: 2
        step: "Refined chemicals"
        description: "Battery-grade lithium, nickel, cobalt and manganese chemicals and intermediates"
        nodes: [lithium-chemicals, nickel-intermediates-and-chemicals, cobalt-intermediates-and-chemicals, manganese-dioxide-emd]
        extended_nodes: [other-battery-metal-chemicals]
      - value_chain_order: 3
        step: "Electrode materials & components"
        description: "Cathode materials, anode graphite, copper foil, electrolyte salt, separators and cell parts"
        nodes: [cathode-materials-and-precursors, synthetic-graphite-anode-grade, battery-materials-foil-electrolyte, accumulator-parts-and-separators]
      - value_chain_order: 4
        step: "Cells & packs"
        description: "Li-ion cells, modules and packs, and other rechargeable batteries"
        nodes: [li-ion-cells-and-packs, other-accumulators]

  - strategic_compact_id: SC-SEMIS
    strategic_compact_name: "Semiconductors & Power Electronics"
    family: "Electrotechnology supply chains"
    purpose: "Coordinate the semiconductor materials, fabrication equipment, chips and power devices that become the converters, inverters and controllers used by solar, storage, vehicles, drives and the grid."
    value_chain:
      - value_chain_order: 1
        step: "Semiconductor materials"
        description: "Gallium, germanium, indium and piezo-electric quartz (extended scope adds rare gases, electronic HF and photoresists)"
        nodes: [gallium-germanium-and-indium, piezo-electric-quartz]
        extended_nodes: [other-semiconductor-materials]
      - value_chain_order: 2
        step: "Fab equipment"
        description: "Wafer, front-end, assembly and test equipment"
        nodes: [semiconductor-manufacturing-equipment]
      - value_chain_order: 3
        step: "Chips, power devices & sensors"
        description: "Integrated circuits, power transistors, diodes and thyristors, semiconductor sensors"
        nodes: [integrated-circuits, power-semiconductors, sensors-and-controller-parts]
      - value_chain_order: 4
        step: "Power-electronics components"
        description: "Film capacitors, inductors and reactors, and converter parts"
        nodes: [power-electronics-components]
      - value_chain_order: 5
        step: "Converters & controllers"
        description: "Static converters and inverters (solar, storage, charging, drives, power supplies), and automatic controllers"
        nodes: [static-converters-and-inverters, automatic-controllers]

  # ---- Power generation equipment -----------------------------------------------------------------

  - strategic_compact_id: SC-SOLAR
    strategic_compact_name: "Solar Manufacturing"
    family: "Power generation equipment"
    purpose: "Keep the polysilicon-to-module chain and its critical inputs (silver paste, cover glass) institutionally connected so that allied module supply does not rest on one country's midstream."
    value_chain:
      - value_chain_order: 1
        step: "Polysilicon"
        description: "Polysilicon (extended scope adds quartz and metallurgical silicon)"
        nodes: [polysilicon]
        extended_nodes: [silicon-metal, other-silicon-products]
      - value_chain_order: 2
        step: "Wafers & silver paste"
        description: "Doped wafers and the silver powder for cell metallisation"
        nodes: [wafers, silver-powder]
      - value_chain_order: 3
        step: "Cells & cover glass"
        description: "PV cells and tempered cover glass (extended scope adds encapsulant and patterned glass)"
        nodes: [solar-cells, pv-cover-glass]
        extended_nodes: [other-pv-materials]
      - value_chain_order: 4
        step: "Modules"
        description: "PV modules, panels and PV generators"
        nodes: [pv-modules-and-generators]

  - strategic_compact_id: SC-WIND
    strategic_compact_name: "Wind & Hydropower Equipment"
    family: "Power generation equipment"
    purpose: "Secure blades, towers and turbines for wind and hydropower, heavy fabricated equipment where logistics and local content favour regional production."
    value_chain:
      - value_chain_order: 1
        step: "Blade materials"
        description: "Balsa core wood (extended scope adds glass and carbon fibre, epoxy, and gearboxes for the nacelle)"
        nodes: [blade-core-wood-balsa]
        extended_nodes: [other-wind-components]
      - value_chain_order: 2
        step: "Blades, towers & turbine parts"
        description: "Wind blades and hubs, steel towers and lattice masts, hydro turbine parts and governors (extended scope adds offshore installation vessels and floating foundations)"
        nodes: [wind-blades-and-hubs, wind-towers, hydro-turbine-parts]
        extended_nodes: [offshore-wind-structures]
      - value_chain_order: 3
        step: "Turbines"
        description: "Wind turbine generating sets and hydro turbines"
        nodes: [wind-turbine-generating-sets, hydro-turbines]

  - strategic_compact_id: SC-NUCLEAR
    strategic_compact_name: "Nuclear Fuel & Reactor Systems"
    family: "Power generation equipment"
    purpose: "Secure the nuclear fuel cycle (uranium, conversion, enrichment, fuel fabrication) and the reactor components that existing and new reactors need."
    value_chain:
      - value_chain_order: 1
        step: "Uranium ore & spent fuel"
        description: "Uranium ores and concentrates; spent fuel and nuclear-grade scrap"
        nodes: [uranium-ores, spent-fuel-and-nuclear-scrap, uranium-fuel-upstream--aggregated]
      - value_chain_order: 2
        step: "Uranium concentrates, conversion & enrichment"
        description: "Natural uranium compounds (HS 284410: mostly mined U3O8 concentrate, with UF6), enriched and depleted uranium"
        nodes: [uranium-conversion-and-enrichment]
      - value_chain_order: 3
        step: "Fuel & nuclear materials"
        description: "Fuel assemblies, nuclear-grade zirconium, heavy water and enriched isotopes"
        nodes: [fuel-assemblies-and-zirconium, nuclear-special-materials]
      - value_chain_order: 4
        step: "Reactor components"
        description: "Reactor vessels, internals and other reactor parts"
        nodes: [reactor-parts]
      - value_chain_order: 5
        step: "Reactors & enrichment machinery"
        description: "Nuclear reactors and isotope-separation (centrifuge) machinery, one traded node"
        nodes: [nuclear-reactors-and-enrichment-machinery]

  # ---- Networks ------------------------------------------------------------------------------------

  - strategic_compact_id: SC-GRID
    strategic_compact_name: "Grid Equipment & Conductors"
    family: "Networks"
    purpose: "Secure the conductor metals and grain-oriented steel behind cables, overhead lines, transformers, switchgear and meters, the long-lead network equipment that paces grid build-out."
    value_chain:
      - value_chain_order: 1
        step: "Copper ore"
        description: "Copper ores and concentrates (extended scope adds bauxite and copper and aluminium scrap)"
        nodes: [copper-ores-and-concentrates]
        extended_nodes: [bauxite-and-other-ores]
      - value_chain_order: 2
        step: "Refined copper"
        description: "Copper smelting and refining (extended scope adds alumina, unwrought aluminium and copper semis)"
        nodes: [copper-smelting-and-refining]
        extended_nodes: [other-copper-and-aluminium-products]
      - value_chain_order: 3
        step: "Wire rod & transformer steel"
        description: "Copper and aluminium wire rod, grain-oriented electrical steel for transformer cores"
        nodes: [copper-wire-and-rod, aluminium-wire-rod, grain-oriented-electrical-steel-goes]
      - value_chain_order: 4
        step: "Insulators & components"
        description: "Line insulators and bushings (extended scope adds transformer and switchgear components and meter parts)"
        nodes: [insulators-and-bushings]
        extended_nodes: [transformer-components, switchgear-components, grid-sensors-and-parts]
      - value_chain_order: 5
        step: "Network equipment"
        description: "Power cables, overhead conductors, transformers, MV/HV switchgear and protection, and electricity meters"
        nodes: [power-cables, overhead-conductors, transformers, switchgear-and-protection, electricity-meters]
        extended_nodes: [other-cables-and-conductors]

  # ---- Electrified end uses ------------------------------------------------------------------------

  - strategic_compact_id: SC-EV
    strategic_compact_name: "Electric Vehicles"
    family: "Electrified end uses"
    purpose: "Keep allied assembly of electric cars, buses, trucks, two-wheelers, works trucks and rail vehicles diversified; the vehicles integrate cells (SC-BATTERIES), motors (SC-MAGNETS) and inverters and chips (SC-SEMIS)."
    value_chain:
      - value_chain_order: 1
        step: "Electric vehicles"
        description: "Electric and plug-in cars, buses, trucks and tractors, two-wheelers and works trucks, rail vehicles (extended scope adds wiring harnesses and non-plug-in hybrids)"
        nodes: [electric-and-plug-in-cars, electric-buses-trucks-and-tractors, electric-two-wheelers-and-works-trucks, electric-rail-vehicles]
        extended_nodes: [ev-components, other-electric-vehicles]

  - strategic_compact_id: SC-HEAT
    strategic_compact_name: "Heat Pumps & Cooling"
    family: "Electrified end uses"
    purpose: "Secure the refrigerants, compressors and finished heat-pump, air-conditioning and solar water-heating units that decarbonise building heat and cooling."
    value_chain:
      - value_chain_order: 1
        step: "Refrigerants"
        description: "HFC and HFO refrigerants and blends"
        nodes: [refrigerants]
      - value_chain_order: 2
        step: "Compressors"
        description: "Refrigeration and heat-pump compressors"
        nodes: [refrigeration-and-heat-pump-compressors]
      - value_chain_order: 3
        step: "Heating & cooling units"
        description: "Heat pumps, air conditioners and solar water heaters"
        nodes: [heat-pumps-and-ac-units, solar-thermal-water-heaters]

  - strategic_compact_id: SC-INDUSTRY
    strategic_compact_name: "Industrial Electrification & Hydrogen"
    family: "Electrified end uses"
    purpose: "Supply the catalysts, electrolysers, hydrogen derivatives, green iron and electric furnaces that let heavy industry replace fossil heat and feedstocks."
    value_chain:
      - value_chain_order: 1
        step: "Catalyst metals"
        description: "Iridium and ruthenium for electrolyser catalysts"
        nodes: [pgms-iridium-ruthenium]
      - value_chain_order: 2
        step: "Electrolysers"
        description: "Electrolysis apparatus"
        nodes: [electrolysers]
      - value_chain_order: 3
        step: "Hydrogen & derivatives"
        description: "Hydrogen, ammonia and methanol"
        nodes: [hydrogen-ammonia-and-methanol]
      - value_chain_order: 4
        step: "Green iron & furnace inputs"
        description: "Direct-reduced iron, graphite electrodes and furnace parts"
        nodes: [direct-reduced-iron-dri-hbi, graphite-electrodes, furnace-parts]
      - value_chain_order: 5
        step: "Electric furnaces & heating"
        description: "Arc, induction, resistance and other electric industrial furnaces and heating equipment"
        nodes: [electric-furnaces-and-heating]

# ---- Deliberately unmapped -------------------------------------------------------------------------
# These nodes stay in every AIB output (node table, classes, workstreams) but sit on no strategic spine.
# None of them belongs to a workstream in the 2026-10-20 run.
unmapped:
  - node_id: biofuels-and-wood-pellets
    scope: core
    reason: "Biodiesel, fuel ethanol and wood pellets come from agricultural and forestry chains with no process link to any electro-industrial compact. Alternative: SC-INDUSTRY as a low-emission fuel beside hydrogen derivatives (the dictionary puts both in one sector), rejected because it shares no input, equipment or producer with that chain."
  - node_id: biofuel-feedstocks
    scope: extended
    reason: "Used cooking oil and inedible fats: the feedstock of the unmapped biofuels node."
  - node_id: critical-mineral-ores
    scope: extended
    reason: "A mixed basket of minor-metal ores (fluorspar, antimony, tin, silver, niobium/tantalum, e-waste) that feeds several compacts at once and none predominantly."
  - node_id: other-critical-minerals
    scope: extended
    reason: "A mixed basket of refined minor metals (antimony, cadmium, hafnium, platinum, silver, tantalum, tellurium, tin, vanadium) serving several compacts at once and none predominantly."

# ---- Workstreams that span two compacts ------------------------------------------------------------
# Written against the Decoupling clustering of 2026-10-21 (after the host alignment screen: 28
# workstreams); matched by `nodes` (see WORKSTREAMS above).
# demand_split is the allied-demand split under Decoupling, for information; the primary compact is
# chosen on industrial logic.
workstream_overrides:
  - workstream_id: AIB-C07
    nodes: [sensors-and-controller-parts, wafers]
    primary_compact: SC-SEMIS
    also_spans: [SC-SOLAR]
    demand_split: "SC-SOLAR 71%, SC-SEMIS 29%"
    reason: "Sensors and controller parts are chips, and HS 381800 wafers are mostly semiconductor-grade (Japan becomes the largest supplier once China is removed); the two cluster on that shared, Japan-led semiconductor base. Filing the workstream under SC-SOLAR on the demand split would put a chip workstream in the solar compact. Wafers stay on the SC-SOLAR spine (the solar chain needs them), and SC-SOLAR shows the workstream as also touching it."

# ---- Mapping notes: the judgement calls ------------------------------------------------------------
# "Alternative:" names the placement that was considered and rejected, so the choice can be revisited.
mapping_notes:
  # SC-MAGNETS
  non-oriented-electrical-steel-ngo: "Motor and generator laminations, so it sits with the drives chain, as GOES sits with transformers in SC-GRID. The data agree: NGO and GOES each form a workstream of their own. Alternative: one electrical-steel step in either compact, on the grounds that the same mills make both grades; rejected because the binding downstream bottlenecks (motor laminations, transformer cores) differ, and GOES is made by far fewer mills."
  ferrite-and-other-magnets: "Non-rare-earth magnets, a substitute for and complement to NdFeB in motors; kept beside the rare-earth magnets."
  magnet-assemblies: "Despite the id, the code is cold isostatic presses (847983), equipment for pressing sintered magnets; placed at the magnet step."
  ac-generators: "Same HS heading family (8501) and the same manufacturers as motors, and the same magnet and NGO inputs. Most of the value is large generators for hydro, thermal and nuclear plants, which take them as inputs from this compact. Alternative: SC-WIND, rejected because wind generating sets are traded complete (850231)."
  electric-motors: "The end of the drives chain. In the 2026-10-21 clustering it shares a workstream with electric cars and motor parts, filed under SC-EV on the demand rule; the node itself stays here."
  rare-earth-permanent-magnets: "The defining node of the compact. It forms a workstream of its own."
  # SC-BATTERIES
  natural-graphite: "Flake and spherical graphite for anodes."
  synthetic-graphite-anode-grade: "Anode material. The same graphitisation capacity also makes arc-furnace electrodes (SC-INDUSTRY)."
  battery-materials-foil-electrolyte: "Copper foil and LiPF6 electrolyte salt; the foil takes refined copper from SC-GRID."
  manganese-dioxide-emd: "Mostly for primary (alkaline) cells, partly an LMO cathode precursor; kept with the refined battery chemicals."
  other-accumulators: "Lead-acid, NiCd, NiMH, sodium-ion and flow batteries: other cell chemistries, kept at the cell step."
  li-ion-cells-and-packs: "The end of the battery chain. Cells feed SC-EV and stationary storage; Its workstream (cells with battery materials, separators, graphite and electric buses) is filed here on the demand rule."
  # SC-SEMIS
  integrated-circuits: "Logic, memory and analog chips share wafers, fab equipment and gallium/germanium with power devices, so chips and power electronics are one compact. ICs are about 70% of its allied demand, so demand-weighted SC-SEMIS figures mostly describe ICs. Alternative: a separate chips compact (materials, fab equipment, ICs, sensors) with power semiconductors, components and converters as a Power Electronics compact; rejected for now because it splits the fab chain and would take an eleventh compact unless electric vehicles went back into SC-BATTERIES."
  semiconductor-manufacturing-equipment: "Capital equipment for chip fabrication: an input to the chips step, not a product made from it."
  power-semiconductors: "IGBTs, MOSFETs (incl. SiC and GaN), diodes and thyristors: made in fabs from wafers and gallium, consumed by converters and inverters. This node is why chips and power electronics share a compact."
  static-converters-and-inverters: "HS 850440 is one heading for solar and storage inverters, EV chargers, motor drives, UPS, ICT power supplies and HVDC/FACTS converters. Placed with the power semiconductors and passives it is assembled from. Alternative: SC-GRID as 'Grid Equipment & Power Electronics' (the name the task suggested), rejected because grid converters are a minority of the heading and it would turn SC-GRID into all electrical equipment; or SC-SOLAR, rejected for the same reason (solar inverters are one use among many)."
  power-electronics-components: "Film capacitors, inductors and reactors, and parts of converters and transformers (850490 is shared with transformers). Placed with the converters, as the dictionary does (Power electronics sector). Alternative: SC-GRID for the reactor and transformer-parts share."
  automatic-controllers: "Industrial regulators and controllers built from chips and sensors; the loosest process link in SC-SEMIS. Alternative: SC-INDUSTRY, rejected because they serve every sector."
  sensors-and-controller-parts: "Semiconductor sensors and MEMS plus parts of controllers: chip-based devices."
  piezo-electric-quartz: "Quartz for frequency-control crystals in electronics."
  # SC-SOLAR
  polysilicon: "Solar-grade polysilicon dominates this code; electronic-grade polysilicon also feeds semiconductor wafers."
  wafers: "HS 381800 covers solar and semiconductor wafers alike, and the dictionary files it under Semiconductor materials. Japan becomes the largest supplier once China is removed, so semiconductor-grade wafers are a large share of the trade. Kept in SC-SOLAR because the task's solar case is polysilicon -> wafers -> cells -> modules, the model's physical constraint for this node is solar wafer capacity (GCIM), and the solar case needs the whole chain. Since the 2026-10-21 run the data cluster wafers with sensors on a Japan-led semiconductor base; that workstream is filed under SC-SEMIS by override while the node stays on the solar spine. Alternative: SC-SEMIS as the substrate of chips and power devices; revisit if the code is split by grade."
  silver-powder: "Silver paste for cell metallisation (the largest use of silver powder); also used in electronics pastes."
  pv-cover-glass: "Tempered cover glass, the module's largest material input by mass."
  # SC-WIND
  wind-turbine-generating-sets: "The wind turbine itself (850231), so it stays on the wind spine. Direct-drive turbines take magnets and generators from SC-MAGNETS; it forms a workstream of its own. Alternative: SC-MAGNETS as the end of a magnets-to-generators chain, rejected because the node is the whole turbine, not its generator."
  wind-towers: "HS 730820 covers steel towers and lattice masts generally, including transmission towers and telecom masts, not only wind towers. Kept with wind, where the dictionary puts it. Alternative: SC-GRID for the transmission-tower share."
  hydro-turbine-parts: "Hydropower shares heavy rotating equipment, castings, forgings and several turbine makers with wind, and is too small (about $0.7bn of allied demand with hydro turbines) for a compact of its own. Alternative: a firm-power grouping with SC-NUCLEAR (shared heavy forgings), rejected because it would blur the nuclear fuel-cycle compact; leaving it unmapped is not possible because it forms a workstream of its own, and every workstream needs a compact."
  hydro-turbines: "As for hydro turbine parts."
  # SC-NUCLEAR
  uranium-fuel-upstream--aggregated: "Data-quality aggregate of uranium ores and spent fuel & nuclear scrap (too little trade to model apart)."
  uranium-conversion-and-enrichment: "Holds HS 284410 (natural uranium compounds), most of which is mined U3O8 concentrate, beside enriched and depleted uranium (284420, 284430); the step is labelled to say so. A reporting-code artefact, not a division of labour: Kazakhstan's and Canada's concentrate exports read as conversion here, while Australia reports its concentrate under ore (261210). The better fix is to move 284410 into the uranium-ore split of config/aib_taxonomy_dictionary.yml, which needs a rerun of scripts/31-32 (2026-10-21 review)."
  spent-fuel-and-nuclear-scrap: "Back-end material (spent fuel, nuclear-grade zirconium scrap) placed at the head of the chain with ore as the feed for reprocessing."
  nuclear-reactors-and-enrichment-machinery: "One node for reactors (840110, about $130m of world trade) and isotope-separation machinery (840120, about $70m). By value it is mostly reactors, so it stays at the end of the chain. Alternative: the conversion & enrichment step, which suits the centrifuge share (Germany and the Netherlands among the top exporters); revisit if the codes are split."
  # SC-GRID
  copper-ores-and-concentrates: "Copper and aluminium are cross-cutting (motors, battery foil, cables). They sit in SC-GRID, where cables, overhead lines, building wire and transformer windings take most conductor metal. With aluminium wire rod they are about 65% of SC-GRID's allied demand, all LOW INTERVENTION under Decoupling. Alternative: a separate base-metals compact (copper is a critical-mineral diplomacy topic in its own right), rejected for now because it is a single-metal chain with no BUILD node and would take an eleventh compact; or unmapped as cross-cutting, rejected because ore-to-rod is a real chain into cables and windings."
  copper-smelting-and-refining: "Cross-cutting conductor metal; see copper ores."
  copper-wire-and-rod: "Feeds power cables and transformer windings (SC-GRID) and motor windings (SC-MAGNETS)."
  aluminium-wire-rod: "Feeds overhead conductors and power cables."
  grain-oriented-electrical-steel-goes: "Transformer cores; the scarce input behind transformer lead times. See NGO steel for the split."
  switchgear-and-protection: "Substation and distribution protection, copper-intensive and procured with transformers by the same network operators."
  electricity-meters: "Grid-edge equipment procured by the same distribution utilities and filed under Grid by the dictionary (Digital grid sector); placed at the network-equipment step because meters are not made from cables or transformers, and its parts (extended) sit at the components step. Its process link to the rest of SC-GRID is weak: meters are electronics. Alternative: SC-SEMIS beside sensors and controllers, rejected because the buyers, standards and security concerns are the grid's."
  # SC-EV
  electric-and-plug-in-cars: "Vehicles integrate three chains (cells, motors, inverters and chips), so they are an end-use compact of their own, as heat pumps and electric furnaces are, matching the dictionary's Electrified End Uses index. Alternative: the integration step of SC-BATTERIES (the first draft), rejected because cars alone (about $180bn) would be half of that compact's allied demand, and car exporters would then dominate its country roles and coverage. The compact's spine has one core step because its upstream sits in the other compacts."
  electric-buses-trucks-and-tractors: "With the other electric vehicles. Its workstream (with Li-ion cells and battery materials) is filed under SC-BATTERIES on the demand rule."
  electric-two-wheelers-and-works-trucks: "E-bikes, e-motorcycles and electric forklifts and works trucks, with the other electric vehicles."
  electric-rail-vehicles: "Electric locomotives, multiple units and trams. Most rail is catenary-fed, so it shares traction motors and power electronics with other vehicles more than batteries; kept with electric vehicles as electrified transport."
  # SC-HEAT
  refrigeration-and-heat-pump-compressors: "Hermetic compressors embed an electric motor (SC-MAGNETS input); the core component of heat pumps and air conditioners."
  heat-pumps-and-ac-units: "The end of the heating and cooling chain. It shares a workstream with compressors, filed here."
  solar-thermal-water-heaters: "Not photovoltaic: a building heat appliance made from collectors, absorbers and tanks, so it sits with heat pumps. Alternative: SC-SOLAR, where the dictionary's Solar sector puts it, rejected because it shares no input or process with the PV chain."
  # SC-INDUSTRY
  pgms-iridium-ruthenium: "Iridium and ruthenium catalysts for PEM electrolysers."
  electrolysers: "HS 854330 also covers electroplating apparatus."
  hydrogen-ammonia-and-methanol: "Products of electrolytic hydrogen and the reductant for green iron. Today's trade is mostly gas-based ammonia and methanol, so its suppliers are gas exporters."
  direct-reduced-iron-dri-hbi: "Hydrogen-based iron is the feed for electric-arc steelmaking. Today's trade is mostly gas-based DRI."
  graphite-electrodes: "Consumable of electric-arc furnaces, the green-steel chain of this compact. Made by graphitising needle coke, the same process step as synthetic anode graphite. Alternative: SC-BATTERIES beside synthetic graphite (shared graphitisation capacity), rejected because its buyers and bottleneck are steelmaking."
  furnace-parts: "Parts of electric furnaces and heaters."
