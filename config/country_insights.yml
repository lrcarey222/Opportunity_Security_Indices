  - {pillar: eo, category: "Production", variable: "size", table: production_depth_momentum_tbl, raw_variable: "production_latest", raw_tech: cell, dict: null, label: "Production", unit_by_cell: {oil-upstream: ["kb/d", kbd], gas-upstream: ["EJ", ej], coal-upstream: ["EJ", ej], coal-downstream: ["TWh", twh], gas-downstream: ["TWh", twh], oil-downstream: ["TWh", twh], nuclear-downstream: ["TWh", twh], solar-downstream: ["TWh", twh], wind-downstream: ["TWh", twh]}, source: ei}

# Plain labels of the index components that have no single raw figure (the "What's behind it" list
# prints "Index component; no single raw figure" beside them). First match wins: `variable` exact, or
# `pattern` (a regular expression); `category` narrows the match when given. `eu_region_mean` (2026-10-14):
# an index made only of regional figures the pipeline copies to every EU member; on an EU member whose
# sibling raw figures all carry the note eu_region_share it gets that note too, with these words.
var_labels:
  - {category: "Consumption", variable: "installed_cap_index", label: "Use per person today (power capacity, or hydrogen use)"}
  - {category: "Consumption", variable: "elec_growth_index", label: "Growth in use per person to 2035"}
  - {category: "Cost Competitiveness", variable: "IEA Cost index", label: "Production cost, IEA cost data"}
  - {category: "Cost Competitiveness", variable: "Input Cost Index", label: "Input costs: labour and capital"}
  - {category: "Cost Competitiveness", variable: "LCOE Index", label: "Cost of generating electricity, today and in 2050"}
  - {category: "Foreign Dependency", variable: "Overall Production", label: "Share of world manufacturing output", eu_region_mean: "the EU's index, carried by each EU member"}
  - {category: "Foreign Dependency", variable: "Mineral Supply", label: "Share of world supply of the technology's minerals (mined or refined)"}
  - {category: "Investment", variable: "Annual Investment Index", label: "Annual investment"}
  - {category: "Investment", variable: "Investment Momentum Index", label: "Growth in investment"}
  - {category: "Investment", variable: "Operating Capacity Index", label: "Capacity operating today"}
  - {category: "Investment", variable: "Pipeline Capacity Index", label: "Capacity under construction or planned"}
  - {category: "Production", variable: "Overall Production", label: "Production: size and growth combined"}
  - {category: "Production", variable: "growth_abs", label: "Growth in production"}
  - {category: "Production", pattern: "^.* Production$", label: "Mined supply of the technology's minerals"}
  - {category: "Technology Demand", variable: "Overall Addressable Market", label: "Market the technology can address to 2050"}
  - {category: "Technology Demand", variable: "Overall Demand", label: "Domestic demand to 2035: size and growth"}
  - {category: "Technology Demand", variable: "Overall Global Demand", label: "World demand to 2035"}
  - {category: "Technology Demand", variable: "Overall Overcapacity", label: "World manufacturing overcapacity"}
  - {category: "Reserves", variable: "Overall Geothermal Potential Index", label: "Geothermal resource potential"}
  - {category: "Reserves", variable: "Overall Solar PV Potential Index", label: "Solar resource potential"}
  - {category: "Reserves", variable: "Overall Wind Potential Index", label: "Wind resource potential"}
  - {category: "Reserves", pattern: "^.* Reserves$", label: "Reserves of the technology's minerals"}

# Raw-figure notes in plain words (the raw value's `note_d`; 2026-10-14). The notes come from the Sector
# facts chunk (production_assumed_zero, eia_production) or from raw_tables `eu_region` (eu_region_share,
# whose words are the entry's own; the line below is the fallback).
raw_note_words:
  production_assumed_zero: "no source reports this production separately, so it is taken as zero"
  eia_production: "production from the U.S. Energy Information Administration's international statistics, as the Energy Institute does not report it separately"
  eia_consumption: "consumption from the U.S. Energy Information Administration's international statistics, as the Energy Institute does not report it"
  fossil_assumed_zero: "a fuel whose production is not reported separately counts as zero in this sum"
  eu_region_share: "the EU's figure, carried by each EU member"

# A raw-figure note that names another source (2026-10-14): the sheet lists that source and the memo's
# source list credits it beside the figure's own (production minus consumption: production from the EIA).
raw_note_sources:
  eia_production: eia_intl
  eia_consumption: eia_intl

# Industrial-policy measures of the Global Trade Alert New Industrial Policy Observatory (user addition
# 2026-10-12): the top active measures per sector from data/processed/nipo_policy_all.rds, ranked by the
# package-adjusted strength (policy_strength_pkg). Context only: NIPO is not in the Policy index.
nipo:
  n_top: 5
  # 2026-10-14: a measure mapped to this many technologies or more (sanctions, most-favoured-nation
  # revocations, export controls) is economy-wide: listed in a sector after its sector-specific measures.
  economy_wide_min_techs: 9
  measure: policy_strength_pkg
  # not_removed (the user's rule, 2026-10-12): active = no removal date or one after the baseline date;
  # measures not yet implemented on that date (announced, scheduled or without a date) are listed, marked
  # as such, and counted (n_not_in_force). in_force: also implemented on or before the baseline date, the
  # NIPO pipeline's own active rule (add_asof_flags()); announced or scheduled measures are then counted,
  # not listed.
  active_rule: not_removed
  # The extract of the latest completed NIPO run: the October 2026 refresh (data/processed/
  # nipo_refresh_manifest.txt: GTA NIPO - October 2026.xlsx, as of 2026-10-05, run 2026-10-13 with the
  # debiased strength and lower-memory pipeline of PR #333). scripts/88 checks it: every title of the run
  # must be in this extract (data/raw), and lists how many are missing from the other extracts on disk.
  vintage: "2026-10"
  extract_file: "GTA NIPO - October 2026.xlsx"
  vintage_label: "Global Trade Alert, New Industrial Policy Observatory, October 2026 extract (as of 5 October 2026)"
  # EU-wide and shared measures (2026-10-14): Global Trade Alert records an EU-level measure under every EU member
  # it applies to (title prefix "EU:", "EC:", ...). A measure recorded under more than one implementing
  # jurisdiction in the run is shared (scope multi), and EU-wide (scope eu) when a part of its title prefix (split
  # on "-", ",", "&" and " and ") is one of these names; a measure recorded under this economy alone is national,
  # whatever its prefix (an "EC:" state-aid approval of a national scheme). The sheet counts them
  # (n_active_eu, n_active_shared, n_listed, n_listed_eu, n_listed_shared) and marks each listed measure.
  eu_prefixes: ["EU", "EC", "European Union", "EU Countries", "European Commission", "EU-27", "EU27"]
  # an EU-prefixed title recorded under fewer jurisdictions than this is "shared", not EU-wide (a joint scheme of a few members)
  eu_min_jurisdictions: 5
  strength_words: "Strength scores a measure by the bite of its instrument (a grant, loan, local-content rule or import ban counts more than monitoring), whether Global Trade Alert judges it to favour domestic firms, how widely it applies (a whole sector counts more than one named firm) and the money or trade it covers; measures that are part of a package of several instrument types count up to 60% more."
  confidence_words: "Mapping confidence says how firmly the measure's product list and text tie it to energy sectors (averaged over the sectors it maps to): 0.10 when none of its listed products are energy-sector goods, 0.25 for a measure without a product list, from 0.75 up when its products fall in these sectors, and up to 2 when its title, source and Global Trade Alert's sector flags corroborate the mapping."

# Generated caveats (A8.4), one sentence each. Placeholders: {country}, {as_of_label}, {share}, {n},
# {few}, {sovereign}. `trigger` is the machine rule the memo renderer evaluates over the cited claims.
caveats:
  relative_scores: {trigger: always, text: "Scores compare {country} with other economies in the same sector; they are not measures of risk or profit in absolute terms."}
  baseline: {trigger: always, text: "All index values are the paper's baseline as of {as_of_label}; Strategic Insights recomputes them under other weightings."}
  rankability: {trigger: cited_unplaced, text: "Some of {country}'s sectors are not placed: a score is compared with other economies only when the economy is sovereign and at most half of the score rests on filled-in data."}
  imputed_driver: {trigger: cited_imputed_driver, text: "Some figures behind these scores are filled in where the source has no value: with zero where a source lists every holder, otherwise with the world average."}
  policy_pams_only: {trigger: policy_token_pams_only, text: "The Climate Action Tracker does not rate {country}, so its policy activity rests on International Energy Agency Policies and Measures records alone; its policy levels compare only with economies on the same basis."}
  no_si: {trigger: no_si, text: "{country} has no Strategic Index because it has no International Energy Agency Policies and Measures records."}
  near_tie: {trigger: near_tie, text: "Strategic Index scores within 0.01 of each other are almost tied: small changes in the data or the weights can swap their order."}
  eu_node: {trigger: network_token_eu, text: "In the allied network design the European Union is one producer; {country}'s shares are derived from its weight within the EU."}
  inherited_alignment: {trigger: alignment_token_inherited, text: "{country} has no UN votes of its own; its alignment is {sovereign}'s."}
  assumed_zero_production: {trigger: cited_raw_note_production_assumed_zero, text: "Where no source reports a country's production of a fuel separately, it is taken as zero, so the balance of production and consumption equals minus consumption."}
  cmfdi_coverage: {trigger: fdi_token, text: "Factory projects are cross-border solar, wind, battery and electric-vehicle manufacturing projects only, announced projects included, which may never be built; domestic investment is not covered (Cleantech Manufacturing FDI Dataset, edition {cmfdi_edition}, CC BY 4.0; counts by the authors, a joint venture counted under its listed parent)."}
  trade_mirror: {trigger: cited_mirror_flow, text: "Where {country} or a partner did not report a flow, it is read from the other side's report, raised by 6% to value it like imports."}
  few_economies: {trigger: cited_few_economies, text: "Some sectors have fewer than {few} economies with comparable scores, so their percentiles move in large steps."}
  cat_eu_bloc: {trigger: cat_token_eu_bloc, text: "The Climate Action Tracker rates the EU as a whole; {country} carries the EU's rating."}
  intra_eu: {trigger: eu_trade_token, text: "Trade figures count trade with other EU members."}
  hkg_reexport: {trigger: hkg_cited, text: "Hong Kong's trade is largely re-exports."}
  pick_stability: {trigger: pick_token, text: "Many allied picks are close calls: in the paper, {share} of them are within 0.01 of the runner-up."}
  ownership_parent: {trigger: china_token, text: "A parent's home is where it is headquartered, not its ultimate owner."}
  eu_policy_records: {trigger: eu_policy_token, text: "{country}'s counts leave out the EU's own {n} International Energy Agency policy records."}
  # 2026-10-14: shortened from 43 to 26 words (section 5 budget); the extract and its as-of date stay in {nipo_vintage}
  nipo_context: {trigger: nipo_token, text: "Industrial-policy measures from the {nipo_vintage} are context only, outside the Policy index."}
  # 2026-10-14: a cited driver whose raw figure is the EU's regional value (raw note eu_region_share)
  eu_region_share: {trigger: cited_raw_note_eu_region_share, text: "Each EU member carries the EU's announced 2035 manufacturing-capacity shares and electric-vehicle figures."}

