  - {path: "meta.trade_year", meaning: "the year of the trade figures"}
  - {path: "meta.un_window", meaning: "the years of UN General Assembly votes behind the alignment scores"}
  - {path: "meta.cmfdi_edition", meaning: "the edition of the CM-FDI cross-border factory-project data"}
  - {path: "meta.rank_threshold", meaning: "the largest share of a score's weight that may rest on filled-in data for the score to be compared with other economies"}
