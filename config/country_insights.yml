# Fields each memo section may use (B3); a token outside its section's list is a warning for the
# verifier. `*` matches one path segment, and a final `.*` the rest of the path; `common` is allowed in
# every section and in the summary.
section_fields:
  common: ["meta.*", "summary.n_*", "summary.quadrants.*", "cells.*.label", "cells.*.label_prose", "cells.*.tech", "cells.*.stage", "cells.*.quadrant", "priority_sectors"]
  "1": ["summary.*", "cells.*.es", "cells.*.es.*", "cells.*.drivers.es.*", "cells.*.trade.sources.*", "cells.*.trade.imports", "cells.*.fdi.*"]
  "2": ["summary.*", "cells.*.eo", "cells.*.eo.*", "cells.*.drivers.eo.*", "cells.*.trade.markets.*", "cells.*.trade.exports"]
  "3": ["summary.top_si.*", "summary.si_order", "cells.*.si", "cells.*.si.*", "cells.*.priority.*", "cells.*.policy.*", "policy.*", "network.pick.*"]
  "4": ["partners.*", "summary.as_partner.*", "summary.psi_1.*", "network.*"]
  "5": ["caveats.*"]
