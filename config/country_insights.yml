# Country Insights (dashboard/, third module) and its policy memos (spec: scratch_dash/country/
# spec_country.md, parts A and B). Read only by scripts/88_export_country_data.R and the pure helpers in
# R/dashboard/country/; the pipeline does not read it. Editorial facts only: words, thresholds, caveat
# texts and triggers, the raw-figure map of the "why" panels, and the memo rules. No weights: every index
# value comes from data/processed (paper baseline).

version: 1

# The verbatim label of every memo (screen, PDF, Word); {as_of_label} is the baseline date.
label: "AI-generated from the data and checked against it; paper baseline as of {as_of_label}."

trade_year: 2024
n_top_partners: 15
n_top_lists: 10
n_order: 25
n_priority_sectors: 3
n_supplier_rows: 12
n_trade_parties: 5
near_tie: 0.01
# The allied-pick rule in words (network.pick.rule_d, 2026-10-14; {excluded} = COUNTRY_PICK_EXCLUDED_TECHS of
# R/dashboard/country/country_network.R in lower case).
pick_rule: "its top upstream or midstream sector on the Strategic Index, leaving out {excluded} (excluded from allied picks by rule) and sectors with no recorded resource base"
few_economies: 10
max_vars_per_category: 4

# enum -> display words (the fact sheet's `words`; tokens and the UI print enums through it)
words:
  quadrant: {grow: "Grow", upgrade: "Upgrade", secure: "Secure", watch: "Watch"}
  third: {high: "top third", middle: "middle third", low: "bottom third"}
  policy_third: {high: "most policy", middle: "middle", low: "least policy"}
  class:
    aligned_high: "top priority with the most policy"
    gap: "top priority with the least policy"
    policy_ahead: "bottom priority with the most policy"
    aligned_low: "bottom priority with the least policy"
    partial: "in between"
  reason: {fs: "reliable supplier", po: "export market", dp: "development partner"}
  match:
    priority_strong_ties: "a priority partner with strong ties today"
    priority_weak_ties: "a priority partner with few ties today"
    ties_lower_priority: "a strong tie today that the index ranks lower"
  alignment: {"1": "same bloc", "0.5": "one nonaligned", "0": "opposite blocs"}
  tier: {core: "core member", partner: "coalition partner", none: "outside the coalition"}
  group: {china: "China", core: "core member", partner: "coalition partner", rest: "other economy"}
  agreement:
    G7: "the G7"
    NATO: "NATO"
    IPEF: "the Indo-Pacific Economic Framework"
    MSP: "the Minerals Security Partnership"
    MSP Forum: "the Minerals Security Partnership Forum"
    U.S. FTA: "a U.S. free-trade agreement"
  stage: {Upstream: "upstream", Midstream: "midstream", Downstream: "downstream"}
  # meta.policy_basis (2026-10-14: printed through words, so the sheet's codes never reach a memo as bare acronyms)
  policy_basis:
    "IEA PAMS + CAT": "International Energy Agency Policies and Measures records and the Climate Action Tracker rating"
    "IEA PAMS only": "International Energy Agency Policies and Measures records only"
  # policy.nipo.policies[].scope (2026-10-14): eu = an EU-level measure (EU title prefix) that Global Trade Alert records
  # under several EU members; multi = a measure recorded under several implementing jurisdictions; national = recorded
  # under this economy alone
  nipo_scope: {eu: "EU-wide", multi: "shared with other jurisdictions", national: "national"}

# The four corners (A4.2 S2): the user's names, with RMI (2025) postures as descriptions.
quadrants:
  grow: {meaning: "High opportunity, high energy security: build on strength", posture: "export promotion"}
  upgrade: {meaning: "High opportunity, low energy security: build capability", posture: "leapfrog"}
  secure: {meaning: "Low opportunity, low energy security: secure supply through partners", posture: "friendshore"}
  watch: {meaning: "Low opportunity, high energy security: look for value elsewhere", posture: "alternative value creation"}

# Missing-data rules (index_outputs missing_rule_applied) in words (A9.6); {country} is filled in.
missing_rules:
  zero: "not reported by the source: counted as zero"
  global_average: "missing for {country}: filled with the world average"

# Sources whose figures never ship (licences; as Sector Insights). A raw row from one of them is shown as
# "Index component; no single raw figure".
restricted_sources: ["BNEF", "Bloomberg", "BCG"]

# Raw figures behind the drivers (A9.6). One entry per (pillar, category, variable) of the index
# contributions; `table` / `raw_variable` name the processed raw row; `raw_tech` is `cell` (the cell's
# technology) or `mineral` (the mineral named in the variable, "Lithium Reserves" -> Lithium); `dict`
# names the config/sector_dictionary.yml entry whose label, unit, display scale, data year and source the
# figure uses (and the Sector Insights link); `constant: true` marks world-market measures that are the
# same for every economy in a sector (never a driver). A variable not listed here shows "Index
# component; no single raw figure". `eu_region` (2026-10-14) marks a regional figure that the pipeline
# copies to every EU member (IEA ETP 2035 manufacturing-capacity shares; IEA EV-region figures): an EU
# member whose value equals the one value the EU members share gets the raw note `eu_region_share`, with
# these words as `note_d` (the page and the memos say it; caveat eu_region_share when a memo cites it).
raw_tables:
  - {pillar: es, category: "Energy Imports", variable: "Production surplus/deficit", table: import_dependence_tbl, raw_variable: "Production surplus/deficit", raw_tech: cell, dict: consumption.balance, item: fuel, label: "Production minus consumption"}
  - {pillar: es, category: "Energy Access", variable: "Energy consumption per capita", table: energy_access_tbl, raw_variable: "Energy consumption per capita", raw_tech: cell, dict: consumption.per_capita, item: fuel, label: "Consumption per person"}
  - {pillar: es, category: "Energy Access", variable: "Energy consumption per capita growth", table: energy_access_tbl, raw_variable: "Energy consumption per capita growth", raw_tech: cell, dict: consumption.pc_change, item: fuel, label: "Change in consumption per person"}
  - {pillar: eo, category: "Energy Access", variable: "Energy consumption per capita", table: energy_access_tbl, raw_variable: "Energy consumption per capita", raw_tech: cell, dict: consumption.per_capita, item: fuel, label: "Consumption per person"}
  - {pillar: eo, category: "Energy Access", variable: "Energy consumption per capita growth", table: energy_access_tbl, raw_variable: "Energy consumption per capita growth", raw_tech: cell, dict: consumption.pc_change, item: fuel, label: "Change in consumption per person"}
  - {pillar: es, category: "Reserves", variable: "Oil Reserves", table: reserves_tbl, raw_variable: "Oil Reserves", raw_tech: cell, dict: resources.fuel_reserves, item: fuel, label: "Proved oil reserves"}
  - {pillar: es, category: "Reserves", variable: "Gas Reserves", table: reserves_tbl, raw_variable: "Gas Reserves", raw_tech: cell, dict: resources.fuel_reserves, item: fuel, label: "Proved gas reserves"}
  - {pillar: es, category: "Reserves", variable: "Coal Reserves", table: reserves_tbl, raw_variable: "Coal Reserves", raw_tech: cell, dict: resources.fuel_reserves, item: fuel, label: "Proved coal reserves"}
  - {pillar: es, category: "Reserves", variable: "Nuclear Reserves", table: reserves_tbl, raw_variable: "Nuclear Reserves", raw_tech: cell, dict: resources.uranium_resources, item: cell, label: "Identified uranium resources"}
  - {pillar: es, category: "Reserves", variable: "Lithium Reserves", table: reserves_tbl, raw_variable: "Lithium Reserves", raw_tech: mineral, dict: resources.mineral_reserves, item: mineral, label: "Lithium reserves"}
  - {pillar: es, category: "Reserves", variable: "Cobalt Reserves", table: reserves_tbl, raw_variable: "Cobalt Reserves", raw_tech: mineral, dict: resources.mineral_reserves, item: mineral, label: "Cobalt reserves"}
  - {pillar: es, category: "Reserves", variable: "Nickel Reserves", table: reserves_tbl, raw_variable: "Nickel Reserves", raw_tech: mineral, dict: resources.mineral_reserves, item: mineral, label: "Nickel reserves"}
  - {pillar: es, category: "Reserves", variable: "Graphite Reserves", table: reserves_tbl, raw_variable: "Graphite Reserves", raw_tech: mineral, dict: resources.mineral_reserves, item: mineral, label: "Graphite reserves"}
  - {pillar: es, category: "Reserves", variable: "Copper Reserves", table: reserves_tbl, raw_variable: "Copper Reserves", raw_tech: mineral, dict: resources.mineral_reserves, item: mineral, label: "Copper reserves"}
  - {pillar: es, category: "Reserves", variable: "Manganese Reserves", table: reserves_tbl, raw_variable: "Manganese Reserves", raw_tech: mineral, dict: resources.mineral_reserves, item: mineral, label: "Manganese reserves"}
  - {pillar: es, category: "Reserves", variable: "Rare Earths Reserves", table: reserves_tbl, raw_variable: "Rare Earths Reserves", raw_tech: mineral, dict: resources.mineral_reserves, item: mineral, label: "Rare-earth reserves"}
  - {pillar: es, category: "Reserves", variable: "Zinc Reserves", table: reserves_tbl, raw_variable: "Zinc Reserves", raw_tech: mineral, dict: resources.mineral_reserves, item: mineral, label: "Zinc reserves"}
  - {pillar: es, category: "Reserves", variable: "PGMs Reserves", table: reserves_tbl, raw_variable: "PGMs Reserves", raw_tech: mineral, dict: resources.mineral_reserves, item: mineral, label: "Platinum-group-metal reserves"}
  - {pillar: es, category: "Production", variable: "Lithium Production", table: critical_minerals_production_tbl, raw_variable: "Lithium Production", raw_tech: mineral, dict: production.mining_ei, item: mineral, label: "Lithium production"}
  - {pillar: es, category: "Production", variable: "Cobalt Production", table: critical_minerals_production_tbl, raw_variable: "Cobalt Production", raw_tech: mineral, dict: production.mining_ei, item: mineral, label: "Cobalt production"}
  - {pillar: es, category: "Production", variable: "Nickel Production", table: critical_minerals_production_tbl, raw_variable: "Nickel Production", raw_tech: mineral, dict: production.mining_ei, item: mineral, label: "Nickel production"}
  - {pillar: es, category: "Production", variable: "Graphite Production", table: critical_minerals_production_tbl, raw_variable: "Graphite Production", raw_tech: mineral, dict: production.mining_ei, item: mineral, label: "Graphite production"}
  - {pillar: es, category: "Production", variable: "Copper Production", table: critical_minerals_production_tbl, raw_variable: "Copper Production", raw_tech: mineral, dict: production.mining_ei, item: mineral, label: "Copper production"}
  - {pillar: es, category: "Production", variable: "Manganese Production", table: critical_minerals_production_tbl, raw_variable: "Manganese Production", raw_tech: mineral, dict: production.mining_ei, item: mineral, label: "Manganese production"}
  - {pillar: es, category: "Production", variable: "Rare Earths Production", table: critical_minerals_production_tbl, raw_variable: "Rare Earths Production", raw_tech: mineral, dict: production.mining_ei, item: mineral, label: "Rare-earth production"}
  - {pillar: es, category: "Production", variable: "Zinc Production", table: critical_minerals_production_tbl, raw_variable: "Zinc Production", raw_tech: mineral, dict: production.mining_ei, item: mineral, label: "Zinc production"}
  - {pillar: es, category: "Production", variable: "PGMs Production", table: critical_minerals_production_tbl, raw_variable: "PGMs Production", raw_tech: mineral, dict: production.mining_ei, item: mineral, label: "Platinum-group-metal production", unit: "kg", unit_kind: kg}
  - {pillar: es, category: "Production", variable: "Nuclear Production", table: critical_minerals_production_tbl, raw_variable: "Nuclear Production", raw_tech: cell, dict: production.uranium, item: cell, label: "Uranium mine production"}
  - {pillar: es, category: "Minerals Trade", variable: "critmin_market_share", table: critical_minerals_trade_tbl, raw_variable: "critmin_market_share", raw_tech: cell, dict: null, label: "Share of world exports of the technology's minerals", unit: "share", unit_kind: share, source: comtrade_critmin}
  - {pillar: es, category: "Minerals Trade", variable: "critmin_hhi", table: critical_minerals_trade_tbl, raw_variable: "critmin_hhi", raw_tech: cell, dict: null, label: "How concentrated world exports of the technology's minerals are", unit: "", unit_kind: hhi, source: comtrade_critmin, constant: true}
  - {pillar: es, category: "Trade", variable: "deficit_gdp", table: trade_concentration_tbl, raw_variable: "deficit_gdp", raw_tech: cell, dict: null, label: "Trade deficit in these goods, share of GDP", unit: "of GDP", unit_kind: share, source: atlas}
  - {pillar: es, category: "Trade", variable: "market_share", table: trade_concentration_tbl, raw_variable: "market_share", raw_tech: cell, dict: trade.atlas_share, item: cell, label: "Share of world exports"}
  - {pillar: es, category: "Trade", variable: "HHI", table: trade_concentration_tbl, raw_variable: "HHI", raw_tech: cell, dict: null, label: "How concentrated world exports of these goods are", unit: "", unit_kind: hhi, source: comtrade_reported, constant: true}
  - {pillar: es, category: "Foreign Dependency", variable: "Market Share", table: foreign_dependency_tbl, raw_variable: "Market Share", raw_tech: cell, dict: manufacturing.share_2035, item: cell, label: "Share of world manufacturing capacity, 2035 (announced)", eu_region: "the EU's announced share, carried by each EU member"}
  - {pillar: es, category: "Foreign Dependency", variable: "market_share", table: foreign_dependency_tbl, raw_variable: "market_share", raw_tech: cell, dict: null, label: "Region's share of world electric-vehicle production", unit: "", unit_kind: share, source: iea_ev, eu_region: "the EU's share, carried by each EU member"}
  - {pillar: es, category: "Foreign Dependency", variable: "net_export", table: foreign_dependency_tbl, raw_variable: "net_export_ratio", raw_tech: cell, dict: manufacturing.ev_net_export_ratio, item: cell, label: "Region's electric-vehicle net export ratio", eu_region: "the EU's ratio, carried by each EU member"}
  - {pillar: es, category: "Foreign Dependency", variable: "production", table: foreign_dependency_tbl, raw_variable: "Domestic.Production", raw_tech: cell, dict: null, label: "Region's electric-vehicle production", unit: "million vehicles", unit_kind: mvehicles, source: iea_ev, eu_region: "the EU's figure, carried by each EU member"}
  - {pillar: es, category: "Foreign Dependency", variable: "sales", table: foreign_dependency_tbl, raw_variable: "Domestic.sales", raw_tech: cell, dict: null, label: "Region's electric-vehicle sales", unit: "million vehicles", unit_kind: mvehicles, source: iea_ev, eu_region: "the EU's figure, carried by each EU member"}
  - {pillar: eo, category: "Foreign Dependency", variable: "Overall Market Share", table: market_share_manufacturing_tbl, raw_variable: "Overall Market Share", raw_tech: cell, dict: null, label: "Share of world manufacturing capacity, 2035 (announced)", unit: "", unit_kind: share, source: iea_etp, eu_region: "the EU's announced share, carried by each EU member"}
  - {pillar: eo, category: "Foreign Dependency", variable: "market_share", table: foreign_dependency_tbl, raw_variable: "market_share", raw_tech: cell, dict: null, label: "Region's share of world electric-vehicle production", unit: "", unit_kind: share, source: iea_ev, eu_region: "the EU's share, carried by each EU member"}
  - {pillar: eo, category: "Foreign Dependency", variable: "net_export", table: foreign_dependency_tbl, raw_variable: "net_export_ratio", raw_tech: cell, dict: manufacturing.ev_net_export_ratio, item: cell, label: "Region's electric-vehicle net export ratio", eu_region: "the EU's ratio, carried by each EU member"}
  - {pillar: eo, category: "Foreign Dependency", variable: "production", table: foreign_dependency_tbl, raw_variable: "Domestic.Production", raw_tech: cell, dict: null, label: "Region's electric-vehicle production", unit: "million vehicles", unit_kind: mvehicles, source: iea_ev, eu_region: "the EU's figure, carried by each EU member"}
  - {pillar: eo, category: "Foreign Dependency", variable: "sales", table: foreign_dependency_tbl, raw_variable: "Domestic.sales", raw_tech: cell, dict: null, label: "Region's electric-vehicle sales", unit: "million vehicles", unit_kind: mvehicles, source: iea_ev, eu_region: "the EU's figure, carried by each EU member"}
  - {pillar: eo, category: "Trade", variable: "export_size", table: export_feasibility_tbl, raw_variable: "exports", raw_tech: cell, dict: null, label: "Exports of these goods", unit: "USD", unit_kind: usd, source: comtrade_reported}
  - {pillar: eo, category: "Trade", variable: "feas", table: export_feasibility_tbl, raw_variable: "feasibility", raw_tech: cell, dict: null, label: "Export feasibility (related capabilities)", unit: "", unit_kind: index01, source: atlas, year: "2023"}
