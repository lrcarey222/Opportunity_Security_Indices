# ---- Memo (part B) ---------------------------------------------------------------------------------

memo:
  title: "{country}: energy security, economic opportunity and partnership priorities"
  subtitle: "Policy memo · Country Insights · Allied Industrial Base Explorer · NEIS Center"
  footer: "Allied Industrial Base Explorer, Country Insights: {country}"
  sections:
    - "Energy security risks and why"
    - "Economic opportunities and why"
    - "Sectoral priorities and the existing policy posture"
    - "Partnership priorities and why"
    - "Data notes and caveats"
  words_total: [900, 1300]
  words_summary: [90, 140]
  summary_bullets: [4, 5]
  words_sections_target: [[220, 300], [180, 260], [180, 260], [180, 260], [80, 150]]
  words_sections_hard: [[180, 340], [150, 300], [150, 300], [150, 300], [60, 180]]
  sentence_words_max: 35
  page_size: Letter

# Lint word lists (B4-B6)
number_words: ["two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety", "hundred", "hundreds", "thousand", "thousands", "million", "millions", "billion", "billions", "dozen", "dozens", "half", "halves", "quarter", "quarters", "twice", "double", "doubled", "triple", "tripled", "majority", "minority", "second", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth"]
number_words_fraction: ["third", "thirds"]
number_warnings: ["one", "first"]
number_phrases: ["the four corners", "best five", "both scores", "three-colour", "one of", "second-largest", "into thirds", "in thirds", "both pillars", "the two low-energy-security corners", "the two high-opportunity corners", "the two scores"]
# Source names that contain an acronym and may stand in plain text (B4: the glossary's source names).
acronym_phrases: ["IEA Policies and Measures", "UN Comtrade", "UN General Assembly"]
causal_words: ["because", "mainly", "driven by", "due to", "pulls", "pull", "pushes", "push", "reflects", "reflect", "explains", "explain", "owing to", "as a result of"]
order_words: ["lowest", "highest", "top", "largest", "strongest", "weakest", "leading", "main", "biggest", "smallest"]
tone_words: ["should", "must", "need to", "needs to", "recommend", "urge", "crisis", "dangerous", "vulnerable", "critical"]
banned_labels: ["secure sector", "secure sectors", "insecure sector", "insecure sectors", "secure stage", "secure stages", "insecure stage", "insecure stages", "secure corner", "insecure", "is secure", "are secure"]
# RMI is an organisation's name (the framework's postures are attributed to "RMI (2025)"), not an abbreviation.
allowed_acronyms: ["EU", "UN", "G7", "NATO", "RMI"]
corner_words: ["Grow", "Upgrade", "Secure", "Watch"]
capital_allowlist: ["Global Trade Alert", "New Industrial Policy Observatory", "Energy Security", "Economic Opportunity", "Strategic Index", "Partnership Strength Index", "Partnership Strength", "Friendshore", "Partnership Opportunity", "Development Potential", "Policy activity", "Climate Action Tracker", "IEA", "International Energy Agency", "Policies and Measures", "UN Comtrade", "Country Insights", "Strategic Insights", "Sector Insights", "Allied Industrial Base Explorer", "RMI", "European Union", "United Nations", "Grow", "Upgrade", "Secure", "Watch", "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December", "Cleantech Manufacturing", "Harvard Atlas", "Atlas of Economic Complexity", "World Bank", "The", "This", "Its", "It", "For", "On", "In", "A", "An", "Where", "When", "Both", "These", "Those", "Among", "Across", "Against", "Compared", "By", "With", "Of", "As", "At", "No", "None", "Scores", "Values", "Trade", "Factory", "Upstream", "Midstream", "Downstream"]
# Names that count as economy names for the "no outside economy names" check (besides the roster).
name_aliases: ["America", "Britain", "UK", "U.S.", "US", "USA", "PRC", "Korea", "Russia", "Taiwan", "Hong Kong", "Macao", "Macau", "Europe"]

# The meaning of every token path (B4): one line per path pattern, filled from the sheet for the claims
# file, so the verifier reads what each number is. `*` matches one path segment (a trailing `*` inside a
# segment matches its rest); the first match wins. Placeholders: {country}, {label} (the sector),
# {name} (the partner), {party} (a trade party), {i} (an ordinal position), {pillar}, {category},
# {variable}, {direction}, {year}, {source}, {n_others}, {trade_year}, {q} (a corner), {class}, {key},
# {scope}.
path_meanings:
  - {path: "meta.country", meaning: "the memo's own country"}
