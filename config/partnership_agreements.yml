# --- Instruments ---------------------------------------------------------------------------
# group: the instrument family the pair roll-up flags (trade, finance, investment, offtake,
# supply, manufacturing, rd, standards, procurement, dialogue, other).
# operational: TRUE for a concrete delivery mechanism (counts toward depth class 4 when coded
# with a specific basis); FALSE for cooperation forms that commit no resources by themselves.
instruments:
  trade_preference:
    label: Trade preference
    group: trade
    operational: true
    patterns:
      - '\bpreferential (tariffs?|treatment|trade|access)\b'
      - '\bfree trade (agreement|area)\b'
      - '\b(comprehensive )?economic partnership agreement\b'
      - '\bCEPA\b'
      - '\bCECA\b'
  tariff_reduction:
    label: Tariff reduction
    group: trade
    operational: true
    patterns:
      - '\btariff (reductions?|elimination|cuts?|concessions?|rate quotas?)\b'
      - '\b(eliminat|reduc|lower|remov)\w* (of )?(the )?tariffs\b'
      - '\bzero[- ]tariffs?\b'
      - '\bduty[- ]free\b'
  market_access:
    label: Market access
    group: trade
    operational: true
    patterns:
      - '\bmarket access\b'
  investment_facilitation:
    label: Investment facilitation
    group: investment
    operational: true
    patterns:
      - '\binvestment (facilitation|promotion|protection)\b'
      - '\b(promote|facilitate|encourage) (mutual |two-way |bilateral |reciprocal )?investments?\b'
  fdi_framework:
    label: FDI framework
    group: investment
    operational: true
    patterns:
      - '\b(bilateral )?investment (agreement|treaty|framework|chapter)\b'
      - '\bforeign direct investment\b'
      - '\binvestment screening\b'
  public_finance:
    label: Public finance
    group: finance
    operational: true
    patterns:
      - '\bconcessional (loans?|finance|financing|credit)\b'
      - '\bsovereign (loans?|guarantees?)\b'
      - '\bgovernment (loans?|financing|funding)\b'
      - '\bpublic (finance|financing|funding)\b'
      - '\bfinancing (of|for) (the )?(projects?|infrastructure|construction)\b'
  export_credit:
    label: Export credit
    group: finance
    operational: true
    patterns:
      - '\bexport credits?\b'
      - '\bexport[- ]import bank\b'
      - '\bEXIM\b'
      - '\bJBIC\b'
      - '\bNEXI\b'
      - '\bK-?EXIM\b|\bK-?SURE\b'
      - '\bUK Export Finance\b'
      - '\bEuler Hermes\b'
  development_finance:
    label: Development finance
    group: finance
    operational: true
    patterns:
      - '\bdevelopment finance\b'
      - '\bDFC\b'
      - '\bofficial development assistance\b|\bODA\b'
      - '\bJICA\b'
      - '\bblended finance\b'
  loan_guarantee:
    label: Loan guarantee
    group: finance
    operational: true
    patterns:
      - '\b(loan|credit) guarantees?\b'
      - '\bguarantee (facility|scheme|programme|program)\b'
  joint_investment_fund:
    label: Joint investment fund
    group: investment
    operational: true
    patterns:
