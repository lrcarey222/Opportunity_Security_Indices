    operational: true
    patterns:
      - '\boff-?take\b'
      - '\bpurchase (commitments?|agreements?|contracts?)\b'
      - '\blong-term (purchase|offtake|sales?) (contracts?|agreements?)\b'
  demand_guarantee:
    label: Demand guarantee
    group: offtake
    operational: true
