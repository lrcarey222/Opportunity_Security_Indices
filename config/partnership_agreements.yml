# Partnership agreements layer (docs/partnership_agreements.md).
#
# Individual agreements from several datasets are normalised to one schema
# (R/agreements/agr_schema.R), linked across sources into canonical agreements, rolled up to
# country pairs with a provisional depth class, and joined to the capability, need and policy
# data for the agreement-gap view. Read by scripts/35 (ingest), 36 (build) and 37 (export).
# Every list below is a controlled vocabulary: the validators in R/agreements stop on a value
# that is not listed here.

version: 1

# --- Sources -------------------------------------------------------------------------------
# One adapter per source (R/agreements/adapter_<id>.R). Each can be ingested on its own
# (scripts/35 --source <id>); scripts/36 reads whichever per-source files exist.
# kind: structured_dataset | curated | project_reference | staged_export
# authority: how the confidence rule treats a record from it (structured | curated | secondary)
sources:
  gsp:
    label: Global Strategic Partnership Dataset
    short: GSP
    citation: >-
      Chang-Liao, N., Fu, Lin (2025). Global Strategic Partnership Dataset, 1990-2020, V1.0.
      Harvard Dataverse, doi:10.7910/DVN/UJD7LW (CC0 1.0); paper: Conflict Management and Peace
      Science 43(4), doi:10.1177/07388942251385542.
    url: https://doi.org/10.7910/DVN/UJD7LW
    licence: CC0-1.0
    kind: structured_dataset
    authority: structured
    raw_files: [gsp_partnership_documents.csv]
  desta:
    label: Design of Trade Agreements (DESTA)
    short: DESTA
    citation: >-
      Dür, A., Baccini, L. and Elsig, M. (2014). The Design of International Trade Agreements:
      Introducing a New Database. Review of International Organizations 9(3): 353-375. DESTA
      version 2.3 (September 2025), designoftradeagreements.org.
    url: https://www.designoftradeagreements.org/downloads/
    licence: none published (citation requested); redistribution of derived facts only
    kind: structured_dataset
    authority: structured
    raw_files: [desta_list_of_treaties.csv, desta_dyads.csv, desta_withdrawals.csv,
                desta_provisions.csv, desta_indices.csv]
  memberships:
    label: Economic-security agreement memberships (project reference)
    short: Memberships
    citation: data/reference/economic_security_agreements.csv (USTR, IPEF, MSP, G7, NATO pages; accessed 2026-10-08)
    url: https://ustr.gov/trade-agreements/free-trade-agreements
    licence: project-authored from official pages
    kind: project_reference
    authority: structured
  curated:
    label: Curated government agreements
    short: Curated
    citation: data/reference/partnership_agreements/curated_agreements.csv (one official source per row)
    url: ''
    licence: project-authored; each row cites its official source
    kind: curated
    authority: curated
  pmemo:
    label: Partnership memo evidence (US-Japan)
    short: Memo evidence
    citation: data/reference/partnership_evidence/ (bilateral_mechanisms.csv, policy_evidence.csv)
    url: ''
    licence: project-authored; each row cites its source
    kind: curated
    authority: curated
  iisd:
    label: IISD Trade & Climate Tracker
    short: IISD
    citation: >-
      IISD (2026). Trade & Climate Tracker. International Institute for Sustainable Development.
      https://www.iisd.org/trade-climate-tracker/
    url: https://www.iisd.org/trade-climate-tracker/
    licence: All rights reserved (IISD); ingest only an export IISD has shared for this use
    kind: staged_export
    authority: structured
    raw_files: [iisd_trade_climate_tracker.csv]

# --- Common schema vocabularies ------------------------------------------------------------
agreement_types:
  treaty: Treaty
  fta: FTA / Trade Agreement
  epa: Economic Partnership Agreement
  strategic_partnership: Strategic Partnership
  framework: Framework Agreement
  mou: MOU
  joint_declaration: Joint Declaration
  joint_statement: Joint Statement
  sectoral_partnership: Sectoral Partnership
  ministerial_initiative: Ministerial Initiative
  plurilateral_forum: Plurilateral forum or club
  financing_agreement: Financing Agreement
  other: Other

# The partnership a document names, where it names one (GSP has no tier field: the label is read
# from the title, else from a body sentence that names the partnership). Empty when none.
partnership_labels:
  comprehensive_strategic: Comprehensive strategic partnership
  global_strategic: Global strategic partnership
  special_strategic: Special strategic partnership
  strategic: Strategic partnership
  comprehensive: Comprehensive partnership
  other_partnership: Other named partnership
# Labels that make class 2 (Framework) of the depth rule on their own.
strategic_partnership_labels: [comprehensive_strategic, global_strategic, special_strategic, strategic]

legal_statuses:
  binding: Legally binding
  non_binding: Political commitment / non-binding
  mixed: Mixed / unclear
  unknown: Unknown

# How legal status was established. A status is never read off the title.
legal_status_bases:
  source_field: the source codes it
  source_document_type: the source's own document type (a treaty in a treaty dataset, a joint statement)
  curated: stated in the official source and recorded by hand
  none: not established

implementation_statuses:
  announced: Announced
  signed: Signed
  in_force: In force
  implementation_underway: Implementation underway
  operational: Implemented / operational
  inactive: Inactive / expired
  cancelled: Cancelled
  unknown: Unknown

# Delivery evidence is separate from existence: only these statuses say an agreement is being
# delivered, and only a source that records projects, disbursements or operating bodies sets them.
delivery_statuses: [implementation_underway, operational]
existence_order: [announced, signed, in_force]

# How a sector, technology, segment or instrument code was obtained. Shown with every code.
coding_bases:
  source_coded: coded by the source dataset (a DESTA provision, an IISD topic)
  curated: recorded by hand from the official text
  type_implied: implied by the source's agreement type (a free-trade agreement reduces tariffs)
  text_title: keyword in the title
  text_body: keyword in a sentence of the published text that also speaks of cooperation

# Evidence grade used by the pair roll-up: specific = source_coded, curated, type_implied or
# text_title; text = text_body only.
specific_bases: [source_coded, curated, type_implied, text_title]

confidence_levels:
  high: primary government or agreement text, or two or more independent sources
  medium: one reputable structured dataset
  low: a secondary source only, or uncertain entity or record matching

