# --- Text coding ---------------------------------------------------------------------------
# A keyword in the published text counts (basis text_body) only when its sentence also speaks of
# cooperation, so that "nuclear" in a sentence about weapons or "steel" in a tariff complaint is
# not read as a partnership. Titles are coded without this test (basis text_title).
text_coding:
  cooperation_patterns:
    - '\bcooperat'
    - '\bco-operat'
    - '\bcollaborat'
    - '\bpartnership'
    - '\bjoint(ly)?\b'
    - '\bwork(ing)? (together|closely)\b'
    - '\bagree[ds]?\b|\bagreement\b'
    - '\bmemorandum\b|\bMOU\b|\bMoC\b'
    - '\b(promot|strengthen|deepen|expand|enhanc|advanc|support|establish|launch)\w*\b'
    - '\bdevelop(s|ed|ing)?\b'
    - '\bcommit\w*\b'
    - '\binvest\w*\b'
    - '合作|协作|伙伴'
    - '協力|連携|パートナーシップ'
    - '협력'
    - 'coopération|partenariat'
    - 'cooperación|asociación'
  # Sentences are split on . ! ? and the CJK full stops; a "sentence" longer than this many
  # characters is cut into pieces of this length so that one run-on paragraph does not pair a
  # keyword with a far-off cooperation word.
  max_sentence_chars: 600
  # Snippet kept with a text code for provenance (characters around the keyword).
  snippet_chars: 160
  # A sector counts as covered from the body text (grade text) when at least this many distinct
  # sentences of one document code it.
  min_body_sentences: 2

# --- Linkage (deduplication) ---------------------------------------------------------------
linkage:
  # Within GSP: documents on the same unordered pair within this many days are one event (both
  # governments often publish; the authors' replication groups pair x year x month).
  gsp_event_window_days: 7
  # Across sources: candidate pairs share the same party set (Jaccard of parties >= this for a
  # plurilateral) and dates within the windows below.
  party_jaccard_min: 0.8
  date_window_days: 45
  year_window: 1
  # Normalised-title token Jaccard needed to link two records (country names, stop words and
  # generic words such as "agreement" removed first).
  title_jaccard_min: 0.5
  # Two trade agreements (fta, epa, or a treaty coded with the trade sector) on the same bilateral
  # pair, signed within year_window of each other, link on that alone (rule trade_pair_year).
  trade_pair_year_rule: true
  # A bilateral trade agreement that one source records as a leg of a small plurilateral another
  # source records (U.S. FTA "NAFTA / USMCA" with Canada vs DESTA's NAFTA) links to the best such
  # plurilateral (rule trade_leg; R/agreements/agr_link.R). Legs of one plurilateral from one source
  # may share its canonical agreement.
  trade_leg_rule: true
  trade_leg_max_parties: 8
  trade_leg_year_window: 5
  trade_leg_min_containment: 0.5
  # A short title wholly inside a longer one ("US-Australia Critical Minerals Framework" in the
  # full title of the same framework) also links: at least this share of the shorter title's
  # tokens, and at least this many tokens in it (rule title_containment; its similarity counts
  # 0.75 x the containment in the score).
  title_containment_min: 0.8
  title_containment_min_tokens: 3
  # Sources whose records may link with each other (two research passes of the curated table can
  # record one agreement twice, e.g. the EU-US critical minerals MoU from both sides). Records of
  # the other sources never link within their source except GSP documents of one event, and a
  # canonical agreement never holds two records of one of exclusive_sources.
  within_source_sources: [curated]
  exclusive_sources: [desta, memberships, pmemo, iisd]
  # Below this match score a candidate link is not merged; both records stay canonical.
  min_link_score: 0.6
  generic_title_words: [agreement, agreements, between, government, governments, republic, kingdom,
    states, united, people, peoples, democratic, federal, federation, the, of, and, 'on', for, in,
    to, a, an, joint, statement, declaration, memorandum, understanding, mou, concerning,
    relating, regarding, with, its, their, state, islamic, socialist, union, s]

# --- Pair roll-up ---------------------------------------------------------------------------
pairs:
  # A non-binding document without a later status counts as active for this many years after its
  # date; binding agreements count while in force (DESTA entry into force, minus withdrawals).
  active_window_years: 10
  recent_years: 5
  # The as-of date of the roll-up (recency windows); scripts/36 overrides it with --as-of.
  as_of: '2026-11-06'
  # EU-level agreements (party EUU) are also attributed to each current member state's pair with
  # the counterpart, flagged via_eu. DESTA already lists EC agreements under member states.
  eu_code: EUU
  propagate_eu: true
  # The EU's seat in a club (G7, the Minerals Security Partnership) does not make its member states
  # members: agreements of these relationship categories are not propagated.
  no_propagate_categories: [plurilateral_club]
  # Plurilateral agreements with more parties than this are kept for the club view but do not
  # lift a pair's depth (NATO, the G7 summit process).
  max_parties_for_depth: 20

# Partnership depth (provisional). Rules are tested in order from 5 down; the first that holds
# sets the class. Each is computed twice: over all agreements (depth_all) and over the
# electro-industrial ones (depth_ei; an agreement is electro-industrial when it covers a sector
# with electro_industrial: true, at a specific grade or a text grade).
depth:
  classes:
    0: No identified partnership
    1: Dialogue
    2: Framework
    3: Sectoral cooperation
    4: Operational partnership
    5: Integrated partnership
  # Class 2: at least one agreement of these types (a formal framework), or a strategic
  # partnership named in a title.
  framework_types: [treaty, fta, epa, strategic_partnership, framework, mou, sectoral_partnership,
    financing_agreement]
  # Class 3: an electro-industrial or industrial sector covered at a specific grade, or at the
  # text grade (min_body_sentences) in a document of the pair. Trade, Science / R&D and General
  # clean energy alone do not make class 3.
  sectoral_exclude: [trade, science_rd, general_clean_energy]
  # Class 4: an operational instrument coded at a specific grade in an agreement that is not
  # cancelled or inactive.
  # Class 5: class 4, plus operational instruments in the trade group AND in the finance or
  # investment groups (or manufacturing), plus class-3 sectoral cooperation, plus evidence that
  # something is in effect: a binding agreement in force or delivery evidence (integrated_needs).
  integrated_needs: in_force_or_delivery   # in_force_or_delivery | delivery

# --- Agreement gaps ------------------------------------------------------------------------
# Joins the pair roll-up to the capability and need data at pair x technology. Every component
# is exported; the quadrant is a labelled rule over them, not a score.
gaps:
  # Complementarity between A (the side with the need) and B (the side with the capability) in a
  # technology x stage cell: B is a recommended partner of A in the cell (strategic_position_tbl
  # recommended_partner_1..3), or A's need percentile >= need_min while B's competitive position
  # percentile >= capability_min in the cell. Cells are evaluated stage by stage; a gap row is per
  # technology and lists the stages where complementarity is high (stages_high).
  need_min: 0.67
  capability_min: 0.75
  # The stages where one economy can supply another. Deployment (installing and using equipment) is
  # demand context, not supply: it is left out of complementarity, need, capability, coverage
  # stages and execution gaps.
  supply_stages: [Extraction, Refining, Components, Assembly, Recovery]
  # Complementarity is high only between economies whose UN-vote alignment (geo_alignment_tbl:
  # 1 same bloc, 0.5 one side non-aligned, 0 opposite blocs) is at least this; a pair in opposite
  # blocs keeps its components but is flagged alignment_blocked. Unknown alignment does not block.
  min_alignment: 0.5
  # Architecture is strong in a technology when an agreement of the pair covers it at a specific
  # grade at a stage where complementarity is high (any stage when it is not). A sector covers the
  # stages listed for it under `sectors` (all six when none are listed): a critical-minerals
  # framework covers Extraction, Refining and Recovery, not battery assembly. strong_depth: when
  # set, a pair whose depth_ei is at least this is also strong; null (the default) keeps the
  # architecture technology- and stage-specific.
  strong_depth: null
  # Execution gap: a cell A prioritises (policy_priority_percentile >= priority_min within A, or a
  # strategic choice in priority_choices) with high-complementarity suppliers at that stage, where
  # none of A's agreements with them covers the technology at that stage at a specific grade.
  priority_min: 0.75
  priority_choices: [secure, partner]
  # Export: per country and technology, the strongest candidates by complementarity.
  top_candidates: 5
