# --- Sectors -------------------------------------------------------------------------------
# The sector list of the brief, mapped onto the dashboard's technologies (strategic_position_tbl
# `tech`) and six stages where one exists. `techs` and `stages` drive the agreement-gap join;
# a sector without techs is shown but cannot be compared with capability data.
# electro_industrial: TRUE puts an agreement that covers the sector into the electro-industrial
# view. fossil_fuels is not in the brief's list; it is kept apart so that LNG, oil and coal
# deals do not land in "General clean energy".
# patterns: case-insensitive regular expressions (PCRE) matched within one sentence. CJK, French
# and Spanish forms catch the main terms of documents published in those languages; other
# languages are not coded (docs, Known limitations).
sectors:
  critical_minerals:
    label: Critical minerals
    electro_industrial: true
    techs: [Batteries, Electric Vehicles, Electric Grid, Wind, Solar]
    stages: [Extraction, Refining, Recovery]
    compacts: [SC-BATTERIES, SC-MAGNETS, SC-SEMIS]
    patterns:
      - 'critical (raw )?(minerals?|materials?)'
      - 'strategic (minerals?|raw materials?|metals?)'
      - 'rare[- ]earths?'
      - '\blithium\b'
      - '\bcobalt\b'
      - '\bnickel\b'
      - '\bgraphite\b'
      - '\bmanganese\b'
      - '\bgallium\b'
      - '\bgermanium\b'
      - '\bcopper\b'
      - 'minerals? (supply|security|sector|resources?|processing|value chains?)'
      - '\bmining\b'
      - '关键矿产|稀土|锂矿|矿产资源'
      - '重要鉱物|レアアース|鉱物資源'
      - '핵심광물|희토류'
      - 'minerais critiques|matières premières critiques|terres rares'
      - 'minerales críticos|materias primas críticas|tierras raras|\blitio\b'
  solar:
    label: Solar
    electro_industrial: true
    techs: [Solar]
    patterns:
      - '\bsolar\b'
      - 'photovoltaic'
      - '\bPV\b'
      - 'polysilicon'
      - '光伏|太阳能'
      - '太陽光|太陽電池'
      - 'solaire|photovoltaïque'
      - 'energía solar|fotovoltaic'
  wind:
    label: Wind
    electro_industrial: true
    techs: [Wind]
    patterns:
      - '\bwind (power|energy|turbines?|farms?|industry|projects?)\b'
      - '\b(offshore|onshore) wind\b'
      - '风电|风能'
      - '風力'
      - 'éolien'
      - 'eólic'
  batteries:
    label: Batteries
    electro_industrial: true
    techs: [Batteries]
    patterns:
      - '\bbatter(y|ies)\b'
      - 'energy storage'
      - '电池|储能'
      - '蓄電池|バッテリー|電池'
      - '배터리|이차전지'
      - '\bbatteries\b|stockage (de l.)?énergie'
      - '\bbaterías?\b|almacenamiento de energía'
  evs:
    label: EVs
    electro_industrial: true
    techs: [Electric Vehicles]
    patterns:
      - 'electric (vehicles?|cars?|buses|mobility)'
      - '\bEVs?\b'
      - '\be-mobility\b'
      - 'zero[- ]emissions? vehicles?'
      - 'new energy vehicles?'
      - 'charging (stations?|infrastructure|networks?)'
      - '新能源汽车|电动汽车'
      - '電気自動車|電動車'
      - '전기차'
      - 'véhicules? électriques?'
      - 'vehículos? eléctricos?|electromovilidad'
  nuclear:
    label: Nuclear
    electro_industrial: true
    techs: [Nuclear]
    patterns:
      - '\bnuclear (energy|power|reactors?|fuels?|plants?|industry|technolog(y|ies)|new build)\b'
      - '\bcivil(ian)? nuclear\b'
      - 'peaceful uses? of (nuclear|atomic) energy'
      - '\batomic energy\b'
      - 'small modular reactors?'
      - '\bSMRs?\b'
      - '\buranium\b'
      - '核电|核能'
      - '原子力'
      - '원자력|원전'
      - 'énergie nucléaire|nucléaire civil'
      - 'energía nuclear'
  grid_equipment:
    label: Grid equipment
    electro_industrial: true
    techs: [Electric Grid]
    stages: [Components, Assembly]
    compacts: [SC-GRID]
    patterns:
      - '\b(electricity|power|electric|energy) grids?\b'
      - '\bsmart grids?\b'
      - '\bgrid (infrastructure|modernis|moderniz|equipment|interconnect|connection|integration)'
      - '\bswitchgear\b'
      - 'electricity interconnect(ion|or)s?|power interconnect(ion|or)s?'
      - '电网'
      - '送電網|電力網'
      - 'réseaux? électriques?'
      - 'redes? eléctricas?'
  transformers:
    label: Transformers
    electro_industrial: true
    techs: [Electric Grid]
    stages: [Components, Assembly]
    compacts: [SC-GRID]
    patterns:
      - '\b(power |distribution |electrical )?transformers?\b'
      - '变压器'
      - '変圧器'
  transmission:
    label: Transmission
    electro_industrial: true
    techs: [Electric Grid]
    stages: [Components, Assembly, Deployment]
    compacts: [SC-GRID]
    patterns:
      - '\b(power |electricity )?transmission (lines?|networks?|infrastructure|systems?|grids?|projects?)\b'
      - '\bhigh[- ]voltage\b'
      - '\bHVDC\b'
      - '\b(submarine|undersea|subsea|power) cables?\b'
      - '输电'
      - '送電'
  power_electronics:
    label: Power electronics
    electro_industrial: true
    techs: [Electric Grid, Solar]
    stages: [Components]
    compacts: [SC-SEMIS]
    patterns:
      - '\bpower electronics\b'
      - '\binverters?\b'
      - '\bpower semiconductors?\b'
      - '\bsilicon carbide\b'
      - '\bgallium nitride\b'
  semiconductors:
    label: Semiconductors
    electro_industrial: true
    techs: []
    compacts: [SC-SEMIS]
    patterns:
      - '\bsemiconductors?\b'
      - '\bmicrochips?\b'
      - '\bchips? (supply|manufacturing|industry|production|fabrication|design)\b'
      - '半导体|芯片|集成电路'
      - '半導体'
      - '반도체'
      - 'semi-?conducteurs?'
      - 'semiconductores?'
  hydrogen:
    label: Hydrogen
    electro_industrial: true
    techs: [Green Hydrogen]
    compacts: [SC-INDUSTRY]
    patterns:
      - '\bhydrogen\b'
      - '\b(fuel |clean |green )ammonia\b'
      - '\belectroly[sz](ers?|is)\b'
      - '氢能|氢气|绿氢'
      - '水素'
      - '수소'
      - 'hydrogène'
      - 'hidrógeno'
  geothermal:
    label: Geothermal
    electro_industrial: true
    techs: [Geothermal]
    patterns:
      - 'geotherm'
      - '地热'
      - '地熱'
      - 'géotherm'
      - 'geotérm'
  ccs:
    label: CCS
    electro_industrial: true
    techs: []
    patterns:
      - '\bcarbon (dioxide )?capture\b'
      - '\bCCUS?\b'
      - '\b(carbon|CO2) (storage|sequestration)\b'
      - 'carbon recycling'
      - '碳捕集'
      - '二酸化炭素回収|\bCCS\b'
  industrial_heat:
    label: Industrial heat
    electro_industrial: true
    techs: []
    compacts: [SC-INDUSTRY, SC-HEAT]
    patterns:
      - '\b(industrial|process) heat\b'
      - '\bheat pumps?\b'
      - '\belectric (arc )?furnaces?\b'
      - '\bindustrial (decarboni[sz]ation|electrification)\b'
  steel:
    label: Steel
    electro_industrial: true
    techs: []
    compacts: [SC-INDUSTRY]
    patterns:
      - '\bsteel\b'
      - '\biron ore\b'
      - '钢铁'
      - '鉄鋼'
      - '\bacier\b'
      - '\bacero\b'
  aluminum:
    label: Aluminum
    electro_industrial: true
    techs: []
    patterns:
      - '\balumin(i)?um\b'
      - '\bbauxite\b'
      - '\balumina\b'
      - '电解铝|铝土矿'
  cement:
    label: Cement
    electro_industrial: true
    techs: []
    patterns:
      - '\bcement\b'
      - '\bclinker\b'
      - '水泥'
  data_centers:
    label: Data centers / compute infrastructure
    electro_industrial: true
    techs: []
    patterns:
      - '\bdata cent(er|re)s?\b'
      - '\b(AI|artificial intelligence|compute|computing|cloud) infrastructure\b'
      - '\bsupercomput'
      - '\bcompute capacity\b'
  general_clean_energy:
    label: General clean energy
    electro_industrial: true
    techs: []
    patterns:
      - '\bclean energy\b'
      - '\brenewable(s| energy| power)\b'
      - '\benergy transition\b'
      - '\blow[- ]carbon\b'
      - '\bdecarboni[sz]'
      - '\bnet[- ]zero\b'
      - '\bcarbon neutral'
      - '\bgreen (energy|transition|growth)\b'
      - '\benergy efficiency\b'
      - '清洁能源|可再生能源|新能源|绿色能源'
      - '再生可能エネルギー|クリーンエネルギー|脱炭素'
      - '재생에너지|청정에너지|탄소중립'
      - 'énergies? renouvelables?|transition énergétique|énergie propre'
      - 'energías? renovables?|transición energética|energía limpia'
  fossil_fuels:
    label: Oil, gas and coal
    electro_industrial: false
    techs: [Oil, Gas, Coal]
    patterns:
      - '\bLNG\b'
