      - '\bmanufacturing (cooperation|partnership|facilit(y|ies)|plants?|capacity|investments?)\b'
      - '\b(build|establish|construct)\w* (a |new )?(factor(y|ies)|plants?|facilit(y|ies))\b'
  rd_cooperation:
    label: R&D cooperation
    group: rd
    operational: true
    patterns:
      - '\bresearch and development\b|\bR&D\b'
      - '\bjoint research\b'
      - '联合研究|共同研究|공동연구'
      - '\bresearch (cooperation|collaboration|programmes?|programs?|projects?)\b'
      - '\bdemonstration (projects?|programmes?|programs?)\b'
  technology_cooperation:
    label: Technology cooperation
    group: rd
    operational: false
    patterns:
      - '\btechnolog(y|ical) (cooperation|collaboration|partnership)\b'
