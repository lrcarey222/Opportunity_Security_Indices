# IMF PCPS indicator code -> IMF Data Explorer composite label.
#
# The SDMX API names an indicator with its short form ("Aluminum"); the Data Explorer
# export the Energy Prices theme was built against composes "<name>, <unit>, <measure>"
# ("Aluminum, US dollars per metric tonne, Unit prices"). The unit is not carried in the
# data message at all, so the fetcher restores it from this table to keep the staged and
# fetched files interchangeable.
#
# Two consumers depend on the composite form:
#   * energy_prices_imf_patterns - the Aluminum pattern requires a unit suffix.
#   * energy_prices_extract_unit() - parses the unit out of the label for output metadata.
#
# Codes absent from this table pass through with the plain API label, so a commodity
# newly published by the IMF degrades to a missing unit rather than a failed fetch.
#
# Derived by matching API series to the 2026-01-22 staged export on observed values
# rather than on label text, which is ambiguous (the API's "Coal" is the coal index,
# not the Australian coal price).
#
# Four aggregate indices (PALLFNF, PEXGALL, PFERT, PNFUEL) are deliberately absent:
# their values had been revised far enough between the two vintages to confirm a match,
# and the theme does not score them. The PCPS exchange-rate series (T*) are absent for a
# different reason - the live flow now returns them as empty stubs with no observations.

