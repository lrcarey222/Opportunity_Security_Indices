- id: imf_commodity_prices
  path: imf_commodity_prices.csv
  fetch_policy: prefer
  source_type: api
  source_name: IMF Primary Commodity Price System (wide export, includes annual YoY
    series)
  url: https://www.imf.org/en/research/commodity-prices
  cadence: monthly
  owner: lcarey@rmi.org
  staged_from: sharepoint
  notes: 'Fetched from the IMF.RES/PCPS SDMX 3.0 flow by scripts/fetchers/imf_sdmx.R.
    fetch_policy is prefer, unlike the other IMF entries: PCPS is a world-level price
    panel with no country dimension, so the coverage divergence that keeps imf_ppi
    and imf_lending_rates on fallback does not apply. Verified against the 2026-01-22
    staged export: 6842 of 6870 overlapping monthly USD observations are identical,
    and all 28 scored commodities still resolve. The 28 differences are upstream revisions
    to Urea, Potassium Fertilizer and Propane - the staged export had frozen Urea
    at 183.7051 for all of 2025, which the fetched series corrects. The flow no longer
    publishes the PCPS exchange-rate series (T*); they return as empty stubs and nothing
    reads them. The INDICATOR labels are kept as the IMF publishes them (config/imf_pcps_indicator_labels.yml)
    but are not a source of units: they are wrong for cobalt (per pound; the series
    is USD per metric tonne) and propane (US cents; the series is USD per gallon)
    and silent for lithium, vanadium, chromium and rare earths. Units come from the
    series metadata, held in energy_prices_pcps_units() (R/categories/energy_prices/energy_prices.R);
    add a row there for a newly mapped commodity.'
  required_by:
  - scripts/10_build_themes.R
  - scripts/40_build_index_vintages.R
