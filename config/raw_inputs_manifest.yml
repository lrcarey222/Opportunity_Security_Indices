  cadence: irregular
  owner: lcarey@rmi.org
  vintage: AR5 (2014)
  staged_from: sharepoint
  notes: Lifecycle medians in gCO2eq/kWh from Schlomer et al. (2014), IPCC AR5 WGIII
    Annex III, Table A.III.2, p. 1335 (not AR6, as this entry used to say). Every
    row matches that one table except oil-fired steam - the file's Source column cites
    Tables A.III.3 to A.III.13 for the rows after coal, but those are transport, industry
    and waste tables and A.III.13 does not exist. Table A.III.2 has no oil row and
    the staged 720 is in no IPCC table, so partnership_strength_clean_ghg() replaces
    it with the SRREN median of 840 (Moomaw et al. 2011, IPCC SRREN Annex II, Table
    A.II.4, p. 982, https://www.ipcc.ch/site/assets/uploads/2018/03/Annex-II-Methodology-1.pdf).
    SRREN's medians come from an unharmonised literature review (its coal median is
    1001, against 820 in AR5), so next to the AR5 rows oil (840) sits just above coal
    (820), although within SRREN oil is below coal. Both PDFs checked 2026-10-07.
  required_by:
  - scripts/10_build_themes.R
  - scripts/15_build_partner_themes.R
