  path: eia_intl_fossil_production.csv
  source_type: api
  source_name: U.S. Energy Information Administration, International Energy Statistics
    (bulk file INTL.zip), fossil fuel production and consumption by country
  url: https://www.eia.gov/opendata/bulk/INTL.zip
  cadence: monthly
  owner: lcarey@rmi.org
  vintage: downloaded (accessed) 2026-10-11; INTL.txt dated 2026-10-03 (24,153,479-byte
    zip); oil production to 2025, gas and coal to 2024, oil consumption to 2024 (2025
    for a few economies)
  licence: US government work, public domain (no API key)
  staged_from: sharepoint
  notes: 'Written by scripts/fetchers/eia_intl.R (Rscript scripts/fetchers/eia_intl.R),
    which downloads the zip into a new temporary directory, parses INTL.txt as data (one
    JSON object per series) and keeps 8 annual series for ISO3 geographies, 2000 on:
    production of crude oil incl. lease condensate (57, TBPD), NGPL (58, TBPD), dry natural
    gas (26, BCM) and coal (7, TJ); consumption of petroleum and other liquids (5, TBPD
    and TJ), dry natural gas (26, BCM) and coal (7, TJ). Tidy columns iso3, country, fuel,
    flow, component, year, value, unit, series_id, value_note (EIA''s code where it gives
    no number: --, NA, ie, w; the value is then missing, never 0), last_updated, fetched_on.
