    panel with no country dimension, so the coverage divergence that keeps imf_ppi and
    imf_lending_rates on fallback does not apply. Verified against the 2026-01-22 staged
    export: 6842 of 6870 overlapping monthly USD observations are identical, and all 28
    scored commodities still resolve. The 28 differences are upstream revisions to Urea,
    Potassium Fertilizer and Propane - the staged export had frozen Urea at 183.7051 for
