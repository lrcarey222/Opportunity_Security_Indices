    for an economy (import dependence and production themes; R/utils/eia_intl.R holds the
    unit conversions, the year rule and the comparability check). fetch_policy is fallback:
    EIA revises the series monthly, so the staged copy is kept until it is refetched on
    purpose. Staged only in the worktree data/raw so far: copy it to the SharePoint raw
    folder.'
