# Golden regression cases for the published AIB Explorer (docs/QC_SYSTEM_DESIGN.md 4.5 and 6.1). Each entry under
# `cases:` maps 1:1 to GoldenCase in dashboard/src/review/model.ts and is evaluated by src/review/qc/golden.ts
# against main's shipped bundles. Every expectation below was read from, and passes on, posture
# 2026-11-17T20:33 @0496e7ba (posture-core.f665dc19) and AIB 2026-11-17 (compacts.c5643da1).
#
# A golden case pins CURRENT behaviour so that any change is deliberate and reviewed. It does not endorse the
# output: where the current result looks doubtful the rationale says so plainly.
#
# expect.choice: canonical key (posture: secure, preserve, catch_up, partner, accelerate, watch, not_assessed;
#   AIB node: the class string, e.g. BUILD; compact: sectoral | narrower | none, the strategic layer's
#   materiality rule on the case's scenario: a material lead mission = sectoral, a targeted lead mission =
#   narrower, no mission = none; R/aib/aib_strategic.R aib_strategic_missions).
# expect.choice_in: the accepted set where more than one result is defensible (then exact: false).
# expect.fence: high (Secure), medium (Preserve, Catch Up, Partner, Accelerate), low (Watch).
# expect.numeric: accepted [min, max] per snapshot fact id (posture: need, prize, cp, home_share; Deployment
#   cells: deployment_need; AIB node: exposure, existing, dividend, residual; compact: lost_usd, exposure,
#   coverage_coordinated). Tolerances are about +/-0.03 on scores and tighter where the case sits on a threshold;
#   a value pinned to a cap (prize 0.59, need 0.61) is pinned exactly.
# change_requires_review: any change fails until NEIS re-approves the case (always true for near_threshold,
#   surprising, method_sensitive and neis_central; also true here for the doubtful entrepot results).
# IDs GC_### are stable and never reused; retire a case by deleting it with a note in the commit, never by
#   renumbering. approved.release stays null until NEIS approves against a data release ID.

cases:
  # ---------------------------------------------------------------------------------------------- obvious_secure
  - id: GC_001
    category: obvious_secure
    kind: posture_cell
    key: {iso3: JPN, tech: Electric Vehicles, stage: Refining}
    expect:
      choice: secure
      fence: high
      numeric: {need: [0.97, 1.0]}
    exact: true
    change_requires_review: false
    rationale: >-
      Japan's processing of EV battery and magnet materials: Secure through the coercive-chokepoint route (need
      0.998; China 47.2% of imports, 94.4% of world supply). An anchor of the Secure override. Two things to watch:
      Batteries/Refining in Japan shares the same world-supply facts (China 94.4%, trusted partners 4.0%) but is
      Catch Up (need 0.939) on a different import mix (China 22.4% of imports), and the opposite-bloc share of
      imports (0.885) is far above the China share (0.472), which should be explained before the cell is used as
      an anchor.
    approved: {by: "draft - pending NEIS approval", on: "2026-11-20", release: null}

  - id: GC_002
    category: obvious_secure
    kind: posture_cell
    key: {iso3: KOR, tech: Nuclear, stage: Refining}
