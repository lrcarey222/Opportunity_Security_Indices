      choice: secure
      fence: high
      numeric: {need: [0.94, 1.0]}
    exact: true
    change_requires_review: false
    rationale: >-
      Korea's nuclear fuel conversion and enrichment: Secure through operational control (need 0.973; Russia 44.2%
      of imports, no measured domestic supply). One of only four operational-control Secure cells in the bundle.
    approved: {by: "draft - pending NEIS approval", on: "2026-11-20", release: null}

