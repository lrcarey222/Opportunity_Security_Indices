# IMF series units come from energy_prices_pcps_units() (R/categories/energy_prices/energy_prices.R,
# the IMF series metadata); this maps its unit text to a unit id. Text not listed -> price_tbc.
price_unit_ids:
  "USD per barrel": usd_bbl
  "USD per MMBtu": usd_mmbtu
  "USD per gallon": usd_gal
  "USD per metric tonne": usd_t
  "USD per pound": usd_lb

# Per-item unit overrides (dict.item_units). `axis` + `item` (slug).
item_units:
  - {var: production.fuels, axis: fuel, item: oil, unit: kbd}
  - {var: production.fuels, axis: fuel, item: gas, unit: ej}
  - {var: production.fuels, axis: fuel, item: coal, unit: ej}
  - {var: resources.fuel_reserves, axis: fuel, item: oil, unit: bbl_tmn}
  - {var: resources.fuel_reserves, axis: fuel, item: gas, unit: m3_tn}
  - {var: resources.fuel_reserves, axis: fuel, item: coal, unit: mt}
  - {var: resources.mineral_reserves, axis: mineral, item: lithium, unit: kt_li}
  - {var: resources.mineral_reserves, axis: mineral, item: cobalt, unit: kt_content}
  - {var: resources.mineral_reserves, axis: mineral, item: copper, unit: kt_content}
  - {var: resources.mineral_reserves, axis: mineral, item: nickel, unit: kt_content}
  - {var: resources.mineral_reserves, axis: mineral, item: zinc, unit: kt_content}
  - {var: resources.mineral_reserves, axis: mineral, item: manganese, unit: kt_gross}
  - {var: resources.mineral_reserves, axis: mineral, item: rare-earths, unit: kt_reo}
  - {var: resources.mineral_reserves, axis: mineral, item: graphite, unit: kt_graphite}
  - {var: resources.mineral_reserves, axis: mineral, item: pgms, unit: kg_pgm}
  - {var: production.mining_ei, axis: mineral, item: manganese, unit: kt}
  - {var: production.mining_ei, axis: mineral, item: zinc, unit: kt}
  - {var: production.mining_ei, axis: mineral, item: pgms, unit: kg}
  - {var: production.refining, axis: mineral, item: graphite, unit: kt_graphite_bg}
  - {var: production.mining, axis: mineral, item: graphite, unit: kt_graphite}
  # IEA Critical Minerals: lithium in Li content; "rare earths" are the magnet rare earth elements
  # (Nd, Pr, Dy, Tb) only, a narrower quantity than the USGS all-rare-earth REO figures.
  - {var: production.mining, axis: mineral, item: lithium, unit: kt_li}
  - {var: production.refining, axis: mineral, item: lithium, unit: kt_li}
  - {var: production.mining, axis: mineral, item: rare-earths, unit: kt_magnet_ree}
  - {var: production.refining, axis: mineral, item: rare-earths, unit: kt_magnet_ree}
  - {var: consumption.mineral_demand, axis: mineral, item: lithium, unit: kt_li}
  - {var: consumption.mineral_demand, axis: mineral, item: rare-earths, unit: kt_magnet_ree}
  # USGS mine production in the chapter's own unit (MCS 2026 "Data in ..."); scripts/87 checks the
  # kt / t scale against the USGS unit column.
  - {var: production.mine_usgs, axis: mineral, item: lithium, unit: t_li}
  - {var: production.mine_usgs, axis: mineral, item: rare-earths, unit: t_reo}
  - {var: production.mine_usgs, axis: mineral, item: nickel, unit: t_content}
  - {var: production.mine_usgs, axis: mineral, item: cobalt, unit: t_content}
  - {var: production.mine_usgs, axis: mineral, item: copper, unit: kt_content}
  - {var: production.mine_usgs, axis: mineral, item: zinc, unit: kt_content}
  - {var: production.mine_usgs, axis: mineral, item: graphite, unit: t_graphite}
  - {var: production.mine_usgs, axis: mineral, item: manganese, unit: kt_gross}

