# World Bank WDI series behind Development Potential (development.wdi, item axis `indicator`): every
# series of data/raw/wb_wdi.csv that partnership_strength_build_development_indicators() ranks, plus
# energy use per person (energy_use_index). `label` is the World Bank series name; `unit` a units id.
# scripts/87 stops when the builder uses a series that is not listed here. In display order.
dev_indicators:
  - {code: NY.GDP.PCAP.KD, label: "GDP per capita (constant 2015 US$)", unit: usd_pc_2015}
  - {code: NY.GDP.MKTP.KD.ZG, label: "GDP growth (annual %)", unit: pct_pa}
  - {code: NV.IND.TOTL.KD.ZG, label: "Industry (including construction), value added (annual % growth)", unit: pct_pa}
  - {code: EG.ELC.ACCS.ZS, label: "Access to electricity (% of population)", unit: pct_pop}
  - {code: EG.USE.PCAP.KG.OE, label: "Energy use (kg of oil equivalent per capita)", unit: kgoe_pc}
  - {code: EG.IMP.CONS.ZS, label: "Energy imports, net (% of energy use)", unit: pct_energy_use}
  - {code: IC.ELC.OUTG.ZS, label: "Firms experiencing electrical outages (% of firms)", unit: pct_firms}
  - {code: NE.GDI.TOTL.ZS, label: "Gross capital formation (% of GDP)", unit: pct_gdp}
  - {code: BX.KLT.DINV.WD.GD.ZS, label: "Foreign direct investment, net inflows (% of GDP)", unit: pct_gdp}
  - {code: NE.TRD.GNFS.ZS, label: "Trade (% of GDP)", unit: pct_gdp}
