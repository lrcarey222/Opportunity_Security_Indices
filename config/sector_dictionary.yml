# Sector Insights dictionary (spec_sector.md 8.5). Read only by scripts/87_export_sector_data.R; the
# pipeline does not read it. It holds the editorial facts the theme tables do not: labels, units, true
# data years, sources, caveats and the rules that turn processed rows into descriptive facts. Every
# caption on the Sector pages is generated from it. Hand-checked; validated by
# sector_dictionary_validate() (R/dashboard/sector/sector_dictionary.R) on every export.
#
# Conventions
#   * One entry per measure (`vars`). `id` is `theme.name` and must be in the measure catalogue of
#     dashboard/src/sector/contract.ts (VAR_CATALOGUE); `theme` equals the id prefix.
#   * `unit` is a key into `units`; a measure whose unit differs by item (production.fuels: oil kb/d,
#     gas and coal EJ) lists every item in `item_units`.
#   * Displayed value = stored value x `display_scale`, in `unit`. Stored values are the processed
#     values verbatim (prov P), so parity with data/processed stays identical().
#   * `prov`: P = a data/processed raw row shipped verbatim; D = derived from processed values by
#     `parity.formula`; X = read from data/raw through a pipeline function.
#   * `link_stage` (not shipped): for measures whose items are not cells (fuels, minerals,
#     commodities, activities, policy tags), the stage of the cells they appear on, through
#     dims.item_links. `any` = every stage.
#   * Caveat texts may hold {placeholders}; scripts/87 fills them from the data (counts) and stops on
#     any it cannot fill.
#   * No index, weight or contribution measure may appear here (a test greps for them).

version: 1

