  - {code: DT.ODA.ODAT.PC.ZS, label: "Net official development assistance received per capita (current US$)", unit: usd_pc_current}
  - {code: DC.DAC.USAL.CD, label: "Net bilateral aid flows from the United States (DAC donor, current US$)", unit: usd_current}
  - {code: GE.PER.RNK, label: "Government effectiveness (percentile rank)", unit: pctile_rank}
