caveats:
  - {id: hs6_overlap, text: "Technology-attributed trade: {n_shared_codes} of the {n_codes} HS6 codes in the baskets count in more than one sector, so values are never added across technologies."}
  - {id: nominal_usd, text: "Current US dollars: 2020 was a COVID trough and fuel prices roughly doubled by 2024, so changes are nominal."}
  - {id: mirror_factor, text: "Where an importer did not report, its imports come from exporters' declarations multiplied by 1.06 (CIF/FOB)."}
  - {id: hkg_hub_matrix, text: "Hong Kong is kept in the matrix and tagged as a re-export hub; importers record goods by origin, so its share is small."}
  - {id: fob_importers, text: "Canada, Mexico and South Africa declare imports FOB, about 5% below the CIF basis of other importers."}
  - {id: exporter_reported, text: "Exporter-reported basis (exporters' own declarations, {n_rca_reporters} reporters); not comparable with the reconciled matrix."}
  - {id: rca_small, text: "Shown only where exporter-reported basket exports reach USD 50 m; smaller exporters read 'too small to compare'."}
  - {id: hkg_excluded, text: "Hong Kong is excluded from the exporter-reported measures as a re-export hub."}
  - {id: atlas_source, text: "Harvard Atlas 2023: a different source and year from the Comtrade 2024 matrix, so it is shown in its own card."}
  - {id: feasibility_reading, text: "Export feasibility is the Atlas of Economic Complexity's relatedness (also called density: 1 minus its 'distance'). For each four-digit product heading in the sector's basket it measures how much of the know-how the product needs the economy already shows: of all other products, each weighted by how often economies export it together with this one (its 'proximity'), the share the economy already exports with a revealed comparative advantage. The sector's value is the average over its headings, each counted once: 0 means none of the related capabilities are in place, 1 means all of them. It describes capabilities, not costs, demand or policy, and it is not a forecast."}
  - {id: sub_component_rule, text: "Sub-components are the groups of HS6 codes the sector's basket is built from (listed with their codes). Each flow uses the same source as the whole sector (the importer's declaration where it reported the sector that year, otherwise the exporter's x1.06), so a sector's sub-components add up to its total. Within one sector each code sits in one sub-component; a code shared with another sector counts in both sectors, so sub-components are never added across sectors."}
  - {id: hhi_reading, text: "Concentration (HHI): take each holder's share of the world total, square it and add up the squares. If one economy held everything the index would be 1; ten equal holders give 0.10 and four give 0.25. One divided by the index is the 'effective number' of equal-sized holders the market behaves like: 0.25 behaves like 4. Where part of the world total is not attributed to any economy, the index is a lower bound ('at least')."}
  - {id: hhi_refs_context, text: "Competition authorities screen mergers with HHI thresholds, usually quoted on a 0-10,000 scale (shares in percent: 1,800 there is 0.18 here). They were written for markets of competing firms, not for trade between whole economies, so they are a yardstick, not a verdict: an economy's exports come from many firms, which may compete with each other."}
  - {id: basket_ev_upstream, text: "Electric Vehicles Upstream trade (a basket since the 2026-10 review) is the battery minerals as ores and concentrates (lithium minerals, nickel, cobalt and manganese ores, natural graphite), codes it shares with Batteries Upstream, plus the magnet rare earths of the traction motor (rare-earth compounds and metals, monazite ore), codes it shares with Wind Upstream. Each code counts fully in every sector that lists it. Steel is the larger use of nickel and manganese ore, and the lithium heading also holds other minerals."}
  - {id: basket_solar_upstream, text: "Solar Upstream trade is silicon metal only (HS 2804.69), the feedstock of polysilicon. Aluminium alloys and silicones use as much silicon metal as solar or more, so most traded silicon metal serves other uses. Silver, quartz, tellurium and copper are left out (copper is in Electric Grid Upstream)."}
  - {id: basket_wind_upstream, text: "Wind Upstream trade is the raw material of the magnet rare earths: rare-earth compounds (HS 2846.90), rare-earth metals (2805.30) and monazite ore (2612.20), the same codes as in Electric Vehicles Upstream. Magnets also go into electronics and industrial motors, and the compounds heading also holds lanthanum and cerium for catalysts and glass."}
  - {id: basket_nuclear_upstream, text: "Nuclear Upstream trade is uranium ores and concentrates (HS 2612.10) and natural uranium and its compounds (2844.10, the heading under which most yellowcake is shipped), moved from Nuclear Midstream in the 2026-10 basket review. The 2844.10 heading also holds natural uranium hexafluoride from conversion, a Midstream step with no code of its own."}
  - {id: basket_nuclear_midstream, text: "Since the 2026-10 basket review Nuclear Midstream no longer includes uranium ores and yellowcake (now in Nuclear Upstream): it keeps enriched uranium, spent fuel, and reactor and steam-plant hardware."}
  - {id: basket_semis_upstream, text: "Semiconductors Upstream trade is unwrought gallium, germanium and indium, their powders and scrap (HS 8112.92, which also holds niobium and vanadium); the Atlas sees it through the older code 8112.91. Semiconductors and LEDs take most gallium, but germanium goes mainly into fibre and infrared optics and indium into display coatings."}
  - {id: basket_ree_moved, text: "Rare-earth compounds and metals moved to the Upstream baskets in the 2026-10 basket review, so this sector's trade starts at the permanent magnet (HS 8505.11)."}
  - {id: critmin_basket, text: "Mineral labels come from HS descriptions: zinc includes galvanized steel, copper includes wire and scrap, silicon includes silicones, graphite includes artificial graphite."}
  - {id: critmin_no_ree_pgm, text: "The Comtrade mineral pull has no rare-earth or PGM codes."}
  - {id: critmin_hkg, text: "Hong Kong is kept in the mineral trade data and tagged as a re-export hub."}
  - {id: critmin_mirror, text: "Exports of economies that did not report come from partners' import declarations, converted to FOB."}
  - {id: ei_reserves_stale, text: "EI stopped updating proved reserves after end-2020."}
  - {id: usgs_withheld, text: "USGS lists some holders without a figure (W, NA or s); they read 'listed without a figure', never zero."}
  - {id: usgs_units, text: "Units differ by mineral: metal content, manganese gross weight, rare-earth oxide, natural graphite; PGMs in kilograms."}
  - {id: brazil_ree, text: "Brazil's rare-earth reserves follow the USGS erratum."}
  - {id: redbook_resources, text: "Identified recoverable resources (reasonably assured plus inferred) below USD 260/kgU, at 1 January 2025."}
  - {id: pv_area_size, text: "Area-integrated potential is mean output times land area, so it ranks mostly by size; shown in scatters, never ranked."}
  - {id: wind_islands, text: "Small islands top the power-density scale."}
  - {id: wind_threshold_tbc, text: "The power-density threshold and hub height behind this share are not recorded in the source extract: unit to confirm."}
  - {id: geo_lcoe_currency, text: "LCOE per kWh in the currency of Franzmann et al. (2025), not yet verified: unit to confirm. No value means no tranche of that size."}
  - {id: ei_residual, text: "EI shows some economies only inside its regional residuals; they read 'not reported separately'."}
  - {id: eia_production, text: "Where EI does not report an economy's production of a fuel separately (it counts it in an 'Other' regional total), production comes from the EIA International Energy Statistics, converted to EI's units: oil = crude oil incl. lease condensate plus NGPL (thousand b/d); gas = dry natural gas, bcm x 0.036 EJ/bcm; coal = gross TJ x 0.95 to net EJ. EIA publishes gas and coal a year after oil, so those values are for the year before (shown beside the value). An EIA zero is a reported zero."}
  - {id: eia_consumption, text: "Where EI lists an economy's production but not its consumption (Angola, Libya, Nigeria, Guyana and others), its consumption comes from the EIA International Energy Statistics too (petroleum and other liquids, dry gas and coal, converted to EJ as production is), for EI's year or, where EIA has not published it yet, the year before."}
  - {id: production_assumed_zero, text: "Where EI does not report an economy's production of a fuel separately (it counts it in an 'Other' regional total) and no EIA value is used, production is assumed to be 0 and the value is marked 'not reported separately': the net balance is then minus consumption and self-sufficiency 0%."}
  - {id: fossil_assumed_zero, text: "Fossil sums oil, gas and coal; a fuel whose production is not reported separately counts as 0 in the sum."}
  - {id: ei_oil_shale, text: "Estonia: EI counts oil shale, which Estonia mines itself, as coal, and EIA's coal series leave it out (EIA's coal consumption is under 1% of EI's), so EIA's coal production is not used. Estonia's coal production is not reported, and its coal and fossil balances read its oil-shale use as imports."}
  - {id: gross_generation, text: "Gross electricity generation."}
  - {id: iea_top6, text: "The IEA names the six largest producers of each mineral; the rest is 'Rest of world', so concentration is a lower bound."}
  - {id: projection_base_case, text: "2030-2040 values are IEA base-case projections."}
  - {id: iea_magnet_ree, text: "For rare earths the IEA covers only the magnet rare earth elements (neodymium, praseodymium, dysprosium and terbium), not all rare earths as USGS does; lithium is in lithium content."}
  - {id: graphite_grade, text: "Graphite refining is battery-grade graphite; graphite mining is natural graphite."}
  - {id: ei_minerals_named, text: "EI's mineral sheets name only leading producers; others are inside 'Rest of world'."}
  - {id: usgs_estimates, text: "USGS 2025 figures are estimates."}
  - {id: uranium_zero, text: "The Red Book lists every producer; other economies mined none."}
  - {id: ev_regions, text: "The IEA reports EV production and sales for five regions; countries in a region share its value and are not ranked."}
  - {id: iea_etp_zero, text: "In the IEA data a 0 means under 1% or not reported."}
  - {id: projection_pipeline, text: "Pipeline shares are of announced capacity, over the world total including 'Other'. The IEA extract names no year (stored as 2035 by the pipeline): year to confirm."}
  - {id: ev_net_export, text: "(Production - sales) / sales: positive means the region produces more EVs than it buys."}
  - {id: cim_estimate, text: "2025 includes estimated fourth-quarter values."}
  - {id: cim_ev_purchases, text: "EV Downstream investment is consumer purchases of zero-emission vehicles."}
  - {id: cim_split, text: "Batteries and EV Upstream are one critical-minerals investment series split by a constant demand share; never add them."}
  - {id: cim_geothermal, text: "Geothermal is enhanced geothermal only."}
  - {id: per_capita_six_fuels, text: "Six fuels only; hydro, biomass and total consumption are not included, so these are not an energy mix."}
  - {id: growth_base_zero, text: "A zero base year reads 'new'; zero to zero reads 'n/a'."}
  - {id: self_sufficiency_ref, text: "100 means production equals consumption; below 100 the economy is a net importer; 0 means fully imported."}
  - {id: gevo_min_base, text: "Growth is shown only where the 2022 level was at least 1,000 cars."}
  - {id: gevo_projection, text: "2035 values are IEA Stated Policies projections, given for five countries."}
  - {id: weo_world, text: "World totals, IEA Stated Policies Scenario; 2024 is the base year."}
  - {id: imf_units, text: "Units from the IMF series metadata; the IMF label text is wrong for cobalt (per tonne, not per pound) and propane (dollars, not cents)."}
  - {id: coal_mean, text: "Coal is the mean of the Australian and South African benchmarks."}
  - {id: prices_world, text: "World prices: the same for every country."}
  - {id: wage_years, text: "Each economy's latest observation; the year is shown beside the value, and values more than 5 years old are marked."}
  - {id: wage_activity, text: "Upstream = mining and utilities (economy-wide total where missing); Midstream = manufacturing; Downstream = construction."}
  - {id: lending_mixed, text: "The rate series differs by economy (lending rate, loans to firms, money-market or policy rate); China is the PBoC one-year loan prime rate."}
  - {id: ppi_levels, text: "Year-on-year change only; PPI levels are not comparable across economies."}
  - {id: trl_global, text: "A property of the technology, the same in every country."}
  - {id: trl_fallback, text: "Cells without their own Guide items use the technology-wide value: {trl_fallback_cells}."}
  - {id: policy_activity, text: "Counts measure policy activity recorded in the IEA Policies and Measures database, not stringency or spending; coverage is uneven."}
  - {id: policy_eu, text: "The EU's own measures appear as 'European Union'."}
  - {id: policy_cross_cutting, text: "{pct_cross_cutting}% of records are economy-wide (cross-cutting); they are left out unless included."}
  - {id: policy_text_tags, text: "Where the IEA gives no technology, the tag comes from keyword rules on the text and is marked 'text-derived'."}
  - {id: cat_dated, text: "Each rating carries its own update date; the EU is rated as a bloc."}
  - {id: alignment_basis, text: "Territories without their own votes take their sovereign's position (basis 'inherited')."}
  - {id: wdi_mean, text: "Each value is the mean of the years the economy reports in {wdi_years}, the value the Development Potential builder reads; the table gives the years averaged for each economy (one year where it reports only one). Series where a higher value means a weaker environment (debt, deposit rates, outages, tariffs, aid dependence) are shown as published, not inverted."}
  - {id: wdi_empty, text: "Series of the extract without any value in {wdi_years}, so not shown: {wdi_empty}."}
  - {id: db_discontinued, text: "The World Bank stopped Doing Business in 2021 after data irregularities; these {db_year} scores are its last. Its successor, B-READY (2024, 50 economies), is in the World Bank indicators of this theme."}
  - {id: crs_scope, text: "Official development assistance from {crs_n_donors} bilateral donors (OECD DAC members and other reporting countries), gross disbursements, {crs_years}, constant {crs_base_year} US dollars (OECD DAC deflators). Multilateral lenders (World Bank, regional development banks, EU institutions) and private flows are not in the extract."}
  - {id: crs_stage, text: "Aid sectors are CRS purpose codes, not technologies. They map to stages by the rule Development Potential used until October 2026: energy to Downstream, industry to Midstream, mineral resources and mining (less its coal and upstream oil and gas) to Upstream, so aid for energy counts on every Downstream sector. Mining aid net of its fossil sub-rows can be negative in a year."}
  - {id: crs_gdp, text: "The {crs_years_total} total divided by one year's GDP (2023, World Bank, current US dollars), as the Development Potential builder divided it until October 2026."}
  - {id: crs_incomplete, text: "Years most donors had not yet reported when the extract was taken are counted in the totals but not shown as years: {crs_incomplete}."}
  - {id: dip_debt, text: "IMF Direct Investment Positions, outward, debt instruments only (loans and debt securities between related firms; equity is not in this measure), as reported by the investing economy: the mean of the years each pair reports in {dip_years}. A reported zero is a real zero; a pair not shown was not reported."}
  - {id: dip_conduit, text: "{dip_n_conduit} of {dip_n} positions involve a conduit financial centre ({dip_conduits}): pass-through positions with little real activity behind them (Damgaard, Elkjaer and Johannesen, IMF 2019). They are shown and flagged; the Friendshore investment component treats positions {dip_conduit_scope} as not observed."}
  - {id: ei_eu_row, text: "The EU row is EI's own European Union total."}
  - {id: cim_capacity_units, text: "Units differ by product; products are never summed."}
  - {id: cim_capacity_status, text: "Operational is the 2025 snapshot and includes plants still ramping up ('operational yet to come online'); under construction, announced and paused are capacity planned to 2030."}
  - {id: cim_power, text: "Capacity additions in the year, GW."}
  - {id: imf_monthly_coal, text: "Coal is the monthly mean of the Australian and South African benchmarks."}
  - {id: cmfdi_coverage, text: "Cross-border greenfield and expansion projects only (a parent investing outside its headquarters economy) in solar, wind, battery and EV manufacturing, announced {fdi_years}: domestic investment, including China's at home, is not in the dataset. {fdi_n_mfg} of the {fdi_n} projects are manufacturing; the rest are R&D, design, testing or logistics sites."}
  - {id: cmfdi_status, text: "Every project status is listed. The projects the Partnership indices use ({fdi_n_index_use}) are manufacturing projects that are Announced, Under construction, Completed or Operational, {fdi_window}: Cancelled, Paused and Closed ones are dropped, as the CM-FDI working paper does, and so are {fdi_n_ceased} completed or listed plants CM-FDI marks as having ceased operations or paused. Announced projects may never be built."}
  - {id: cmfdi_hq, text: "The investor is the economy where the parent company is headquartered, as CM-FDI records it, not its ultimate owner. Parents headquartered in {fdi_china_hq} count as Chinese, as in the Partnership indices (elsewhere in Sector Insights Hong Kong is in the rest of the world). Counts are raw: a joint venture ({fdi_n_jv} projects) counts wholly under its listed parent, while the indices attribute only part of it to the parent."}
  - {id: cmfdi_undisclosed, text: "{fdi_n_undisclosed} of {fdi_n} projects disclose no capital investment: they are shown as 'not disclosed', never as zero, and value sums cover disclosed projects only (the CM-FDI explorer counts them as zero)."}
  - {id: cmfdi_announced, text: "Announced or reported capital investment in current US dollars, as published: not audited spending and not adjusted for inflation. {fdi_n_fdimarkets} values cite fDi Markets (Financial Times); {fdi_n_unverified_amount} value sources are marked [UNVERIFIED] by CM-FDI."}
  - {id: cmfdi_year_completed, text: "Year completed is the planned year for projects that are not yet complete."}

# Concentration thresholds competition authorities use for mergers (dict.hhi_refs), context for the
# HHI explainer only (caveat hhi_refs_context). `value` on the 0-1 scale of the summaries, `points` on
# the authorities' 0-10,000 scale; `side`: the label describes markets above (or below) the value.
hhi_refs:
  - {id: eu_2004_unlikely, value: 0.10, points: 1000, side: below, label: "concentration concerns unlikely", authority: "European Commission", document: "Guidelines on the assessment of horizontal mergers (2004/C 31/03), paragraph 19", year: 2004}
  - {id: us_2010_moderate, value: 0.15, points: 1500, side: above, label: "moderately concentrated (to 0.25)", authority: "US Department of Justice and Federal Trade Commission", document: "Horizontal Merger Guidelines (2010), section 5.3", year: 2010}
  - {id: us_2023_high, value: 0.18, points: 1800, side: above, label: "highly concentrated", authority: "US Department of Justice and Federal Trade Commission", document: "Merger Guidelines (2023), Guideline 1", year: 2023}
  - {id: us_2010_high, value: 0.25, points: 2500, side: above, label: "highly concentrated (2010 guidelines)", authority: "US Department of Justice and Federal Trade Commission", document: "Horizontal Merger Guidelines (2010), section 5.3", year: 2010}

themes:
  - {slug: trade, label: "Trade", order: 1, default_var: trade.exports, description: "Exports, imports, flows and concentration of each sector's HS6 basket, plus mineral exports."}
  - {slug: resources, label: "Reserves & resources", order: 2, default_var: resources.mineral_reserves, description: "Fuel and mineral reserves, uranium resources, and solar, wind and geothermal potential."}
  - {slug: production, label: "Production", order: 3, default_var: production.fuels, description: "Fuel, power, mineral and uranium production, and EV production by region."}
  - {slug: consumption, label: "Consumption & dependence", order: 4, default_var: consumption.per_capita, description: "Energy use per person, net balances, self-sufficiency, EV sales and the world outlook."}
  - {slug: investment, label: "Investment", order: 5, default_var: investment.annual, description: "Clean-technology investment by economy and sector, 2018-2025, power capacity additions, and cross-border manufacturing projects (CM-FDI)."}
  - {slug: manufacturing, label: "Manufacturing capacity", order: 6, default_var: manufacturing.share_now, description: "Shares of global manufacturing capacity, now and announced for 2035, and capacity by product."}
  - {slug: prices, label: "Prices & costs", order: 7, default_var: prices.latest, description: "Commodity prices and volatility, wages, lending rates and producer-price inflation."}
  - {slug: technology, label: "Technology & outlook", order: 8, default_var: technology.trl, description: "Technology readiness of each sector, from the IEA Clean Energy Technology Guide."}
  - {slug: policy, label: "Policy", order: 9, default_var: policy.records, description: "Recorded energy policies by economy, technology and year, and Climate Action Tracker ratings."}
  - {slug: development, label: "Development & finance", order: 10, default_var: development.wdi, description: "Development indicators from the World Bank, official development assistance (who funds whom, by aid sector), bilateral direct-investment positions (who invests where) and positions on the US-China UN-vote axis."}

