rules:
  - tech: Coal
    all_tokens: ["Fossil fuels", "Coal"]

  - tech: ["Oil", "Gas"]
    all_tokens: ["Fossil fuels", "Oil and gas"]

  - tech: Batteries
    any_tokens: ["Battery", "Electrochemical storage", "Storage"]
    any_supplychain_tokens: ["Battery production", "Battery recycling", "Battery charging", "Power storage"]
    any_name_regex: ["battery", "\bcell\b", "electrochemical storage"]
    exclude_tokens: ["Mining"]

  - tech: Electric Vehicles
    any_tokens: ["Road transport", "Battery electric vehicle"]
    any_supplychain_tokens: ["Vehicle", "Vehicle component", "Transport infrastructure"]
    exclude_tokens: ["Battery"]

  - tech: Green Hydrogen
    any_tokens: ["Hydrogen"]
    any_supplychain_tokens: ["H2 production", "H2 transport", "H2 storage", "H2 use", "Hydrogen production", "Hydrogen transport", "Hydrogen storage", "Hydrogen use"]
    any_name_regex: ["electrolys", "green hydrogen", "renewable hydrogen"]
    exclude_tokens: ["Fossil fuels"]

  - tech: Electric Grid
    any_tokens: ["Infrastructure", "Grid"]
    any_supplychain_tokens: ["Power transport", "Transmission", "Distribution", "Grid operation", "Power system"]
    any_name_regex: ["transmission", "distribution", "smart grid", "substation", "grid"]

  - tech: Solar
    any_name_regex: ["\\bPV\\b", "solar", "photovoltaic"]

  - tech: Wind
    any_name_regex: ["wind"]

  - tech: Nuclear
    any_name_regex: ["nuclear", "reactor"]

  - tech: Geothermal
    any_name_regex: ["geothermal"]
