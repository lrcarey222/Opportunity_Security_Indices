# Allied Industrial Base (AIB) module: trade partnership network, investment partnership
# prioritization, emergent AIB network and Sectoral Compact formation (docs/aib_methodology.md).
# Read by scripts/31_build_aib_trade_network.R, scripts/32_build_aib_partnerships.R and
# scripts/84_export_aib_data.R; the functions are in R/aib/ (pure). Every threshold below is a
# setting, not a finding: the outputs record which values produced them.
#
# The module sits beside the OSI indices and the allied network design (scripts/30); it reads
# their inputs but changes neither. It builds no composite score and fixes no alliance in advance:
# the candidate universe is a setting and defaults to every economy in the trade data.

# ---- Taxonomy -------------------------------------------------------------------------------
# Which HS6 taxonomy defines the nodes: dictionary (data/reference/electro_industrial_hs6_dictionary.csv,
# RMI's Electro-Industrial Stack: index > sector > stage > HS6; the default since 2026-10-19) or master
# (the OSI energy basket, data/reference/energy_hs6_master.csv). The taxonomy-specific settings (nodes
# and splits, strategic scope, supply-chain and material links, production proxies, validation cases)
# are in config/aib_taxonomy_<taxonomy>.yml, read on top of this file; --taxonomy overrides it.
taxonomy: dictionary

# ---- Observed trade network -----------------------------------------------------------------
trade:
  # Reference year of the bilateral flows (the latest all-reporter pull with HS2022 codes) and the
  # earlier year used only for the time-series check in the data-quality flags.
  year: 2024
  history_year: 2020
  # Importer's declaration first, else the exporter's at the CIF/FOB factor (config/partnership.yml).
  cif_fob_factor: 1.06
  # A flow below this (USD) is noise, not a relationship (rounding, samples, re-imports).
  min_flow_usd: 10000
  # An exporter is a candidate partner in a node when its observed exports reach both bars (the
  # larger one binds); smaller exporters keep their current shipments but are not re-optimized.
  candidate_min_exports_usd: 1.0e+6
  candidate_min_world_share: 0.0005
  # Shipments that trade hubs re-export are attributed to the origin they re-export for the
  # country shocks (Hong Kong and Macao for China). The hubs stay in the network otherwise.
  reexport_hubs:
    CHN: [HKG, MAC]
  # Open ship registries: vessels (HS 89) "trade" through the flag they fly, so these economies show
  # up as large importers and exporters of tankers and platforms. They are kept out of the candidate
  # universe (no demand to restore, no partner); their shipments stay as observed.
  exclude_from_universe: [LBR, MHL, PAN, BHS]

# ---- Demand scope and candidate-partner universe --------------------------------------------
# Two separate sets (every output names both):
#   demand_scope                importers whose lost supply the module restores: the economies the
#                               AIB protects.
#   candidate_partner_universe  exporters that may add or redirect supply (new and expanded
#                               relationships, investment hosts, coalition members).
# Modes: configured (the `countries` listed), coalition (the `tiers` of
# data/processed/coalition_tbl.rds), or global (every economy in the trade data). A comma list of
# ISO3 codes on the command line (--demand-scope / --partner-universe) overrides either.
# The default protects the allied set and lets any economy supply it. Global demand with global
# partners (the first full run, 2026-10-15) is a sensitivity: it treats every importer's
# shortfall, including the shocked economy's own customers, as the AIB's problem.
demand_scope:
  mode: coalition
  tiers: [core, partner]
  countries: []
candidate_partner_universe:
  mode: global
  tiers: [core, partner]
  countries: []

# ---- Shocks ---------------------------------------------------------------------------------
# type country: the listed exporters lose `fraction` of their exports in every node.
# type largest_supplier: the largest exporter of the node (level subsector), of the node's stage
# (level stage) or of its technology (level technology) loses `fraction` of its exports.
shocks:
  - id: china_100
    label: China supply removed
    type: country
    countries: [CHN]
    fraction: 1.0
  - id: china_50
    label: China supply halved
    type: country
    countries: [CHN]
    fraction: 0.5
  - id: largest_subsector
    label: Largest supplier of the sub-sector removed
    type: largest_supplier
    level: subsector
    fraction: 1.0
  - id: largest_stage
    label: Largest supplier of the stage removed
    type: largest_supplier
    level: stage
    fraction: 1.0
  - id: largest_technology
    label: Largest supplier of the technology removed
    type: largest_supplier
    level: technology
    fraction: 1.0
  # type diversify: no supplier is removed. Each node more concentrated than its higher-level sector is
  # brought to that sector's concentration (exporter HHI, re-export hubs counted with their origin):
  #   benchmark hs4     the trade-weighted mean HHI of the other HS6 lines of the node's parent HS4
  #                     heading(s) in the Atlas HS92 panel, latest year (electric cars against petrol,
  #                     diesel and hybrid cars), falling back to the sector benchmark where the heading
  #                     has no other line;
  #   benchmark sector  the trade-weighted mean HHI of the other nodes of the node's sector.
  # The supplier-share cap that brings the node to its benchmark applies: suppliers above it lose the
  # excess of their sales to the demand scope, and the optimized state keeps the cap. Nodes within
  # min_excess of their benchmark are left alone.
  - id: diversify_benchmark
    label: Diversified to its sector's concentration
    type: diversify
    benchmark: hs4
    min_excess: 0.005
# Shock semantics, every one run; the first is the headline.
#   hold     an export / supply shock: the shocked economy keeps buying, so exports headed to it
#            stay there in both scenarios (the security stress test).
#   release  a two-way cut: its purchases fall by the same fraction and that share of the exports
#            headed to it is freed for others (a sensitivity). The dashboard's "Decoupling" scenario
#            is the headline shock under hold, not this.
shocked_demand: [hold, release]
# The shock the compact layer, the investment simulation and the dashboard lead with.
headline_shock: china_100

# ---- Supply scenarios -----------------------------------------------------------------------
# conservative: every surviving shipment to the demand scope stays where it is; only the supply
#   the shock frees (exports that were headed to the shocked economy, under release) can move.
# reallocation: a candidate partner can also redirect its observed exports to markets outside the
#   demand scope toward it (its sales to the shocked economy only as far as release frees them).
# Observed exports are revealed tradable capability, not spare physical capacity.
scenarios: [conservative, reallocation]
headline_scenario: reallocation

# ---- Physical supply constraint -------------------------------------------------------------
# Every mode is run; the first is the headline.
#   trade_only              observed exports bound what a supplier can provide.
#   production_constrained  where credible production or capacity shares exist (production_proxies
#                           below), physical evidence decides who can supply: an exporter the data
#                           list as a producer (share above producer_min_share) keeps its full trade
#                           response; one they do not list (a re-exporter, stock, or a different
#                           product under the same HS code, e.g. semiconductor wafers in HS 3818.00)
#                           keeps its current shipments to the demand scope but cannot expand or
#                           redirect supply toward it. Shares are not converted into trade values
#                           (production is volume, trade is value; where the dominant producer uses
#                           most of its own output, world trade is far below world production).
#                           Nodes without credible physical data keep their trade-only result, flagged.
# A node's physical data are credible when the proxy covers at least min_physical_completeness of
# world production. Where physical and trade concentration diverge by divergence_threshold or more
# (largest-supplier share, or China's share) and the node is not physically constrained, a LOW
# INTERVENTION or COORDINATE class carries the warning PHYSICAL CAPABILITY NOT VALIDATED.
supply_constraint:
  modes: [production_constrained, trade_only]
  min_physical_completeness: 0.80
  producer_min_share: 0.0
  divergence_threshold: 0.25

# ---- Trade optimization ---------------------------------------------------------------------
optimization:
  # Lexicographic objectives (each later one only among solutions within the tolerance of the
  # earlier optimum): 1 demand served; 2 revealed specialization (capped RCA, ties by world
  # export share); 3 Export Opportunity (exporter -> market); 4 revealed policy/climate
  # compatibility. Tolerances are relative to the earlier optimum.
  # Coverage is held within 0.05% of its maximum: a wider band lets the tie-breaks of state B (an
  # incomplete graph) buy Export Opportunity with coverage and fakes a coordination dividend.
  tolerance_coverage: 0.0005
  # The stability rule (objective 1b, cut surviving shipments as little as possible) sits between
  # coverage and specialization; it is a module addition, not one of the four spec objectives.
  tolerance_stability: 1.0e-6
  tolerance_specialization: 0.02
  tolerance_opportunity: 0.02
  # RCA above this counts as fully specialized in objective 2.
  rca_cap: 4
  # A country may keep its own exports at home to replace lost imports (domestic retention).
  allow_domestic_retention: true
  # State B (existing-network adaptation): an observed relationship may grow to at most
  # (1 + this) times its 2024 size. Without a bound any USD 10k relationship could carry unlimited
  # volume and "existing relationships" would be as flexible as new ones (on the first full run,
  # 2026-10-15, the coordination dividend was ~0 in 89 of 91 nodes for that reason). .inf = unbounded.
  existing_relationship_growth: 1.0
  # Sensitivity of the existing network (and of the COORDINATE class) to that bound: about 1.25x,
  # 2x, 4x and unlimited (allied_trade_growth_sensitivity.csv).
  existing_growth_sensitivity: [0.25, 1.0, 3.0, .inf]
  # Maximum share of the universe's post-shock supply any one candidate exporter may provide.
  # 1 means no constraint; the frontier runs every value.
  max_supplier_share: [0.25, 0.40, 0.60, 1.00]
  headline_max_supplier_share: 1.00
  # The minimum sufficient diversification of a node is the tightest share whose optimized
  # coverage stays within this many points of the unconstrained optimum.
  frontier_coverage_tolerance: 0.02
  # Minimum required diversification: the loosest supplier limit at which coverage stays at or
  # above this even if the optimized allocation then loses its largest supplier as well.
  frontier_acceptable_coverage: 0.80
  # Missing Export Opportunity or compatibility scores count as neutral in the tie-breaks.
  neutral_score: 0.5

# Revealed policy/climate compatibility (objective 4 and the investment tie-break): similarity of
# the two economies' IEA PAMS policy intensity in the node's technology and stage, and of their
# Climate Action Tracker ratings. No geopolitical alignment score enters by default.
compatibility:
  components: [pams, cat]

# ---- Investment partnership prioritization (marginal capacity simulation) --------------------
investment:
  # Shocks and scenarios simulated. Nodes whose optimized residual gap (share of universe demand)
  # reaches min_residual_gap under a shock enter the simulation for it.
  shocks: [china_100, largest_subsector, diversify_benchmark]
  scenarios: [reallocation, conservative]
  min_residual_gap: 0.05
  # Eligible hosts simulated per node, the most capable first (capability tier, then value).
  max_hosts_per_node: 20
  # Synthetic capacity added at one host, as a share of the node's universe demand.
  increments: [0.05, 0.10, 0.20]
  headline_increment: 0.10
  # A host must show revealed capability: RCA >= host_min_rca in the node, or a world export
  # share >= host_min_world_share in the node, or RCA >= host_min_rca in a node linked to it in
  # the supply chain (same stage of the same technology, or a material link below), or a
  # production share >= host_min_production_share. Friendshore cannot qualify a host.
  host_min_rca: 1.0
  host_min_world_share: 0.005
  host_min_production_share: 0.01
  # RCA counts only on material exports: at least this much (USD) or this share of the node's
  # world trade, whichever bar is lower (tiny economies otherwise get huge RCAs).
  host_min_exports_usd: 5.0e+7
  host_min_material_share: 0.01
  # The resilience gain is also reported with this supplier-share limit in force, where capacity
  # at an already dominant supplier adds little.
  diversified_max_supplier_share: 0.40
  # Gains within these margins count as ties in the ordering (resilience, then diversification).
  tie_resilience: 0.005
  tie_hhi: 0.005
  # Hosts listed per node in the partnership table.
  top_hosts: 5
  # Never hosts: open ship registries, whose vessel "exports" are flag transfers, not shipbuilding.
  exclude_hosts: [LBR, MHL, PAN, BHS]

# ---- Node classification (policy interpretations of the continuous results) ------------------
classification:
  # Shock exposure (lost share of universe demand) below this is LOW INTERVENTION.
  low_exposure: 0.15
  # Existing relationships already restore demand to at least this coverage: LOW INTERVENTION.
  adequate_coverage: 0.90
  # BUILD: optimized residual gap at least this share of demand.
  build_gap: 0.10
  # COORDINATE: coordination dividend at least this.
  coordinate_dividend: 0.05
  # Order: low exposure -> LOW; residual gap -> BUILD; concentration -> MANAGE SPECIALIZATION;
  # adequate existing resilience -> LOW; coordination dividend -> COORDINATE; otherwise LOW.
  # MANAGE SPECIALIZATION: the optimized solution's largest supplier holds at least this share,
  # or diversifying to `manage_cap` costs at least `manage_coverage_loss` of coverage.
  manage_largest_share: 0.40
  # ... or the three largest optimized suppliers hold at least this share ("a few suppliers").
  manage_top3_share: 0.75
  manage_cap: 0.40
  manage_coverage_loss: 0.05
  # Severity bands of shock exposure for the network counts.
  high_severity: 0.40

# ---- Sectoral compact formation -------------------------------------------------------------
compacts:
  # Partner-network overlap or complementarity: cosine similarity of the nodes' country roles.
  min_partner_similarity: 0.35
  # Policy coherence: cosine similarity of the nodes' policy-need profiles.
  min_policy_similarity: 0.50
  # Demand anchors: the importers that together hold this share of the compact's lost supply.
  anchor_share: 0.60
  max_anchors: 6
  # A member is an anchor of one node when it holds at least this share of that node's lost supply
  # (used for the bridge-partner role: supplies one node, depends on another).
  node_anchor_share: 0.10
  # The investment response in the compact coverage comparison: the headline increment at this
  # many of the compact's leading hosts in each BUILD node.
  investment_hosts_per_node: 2
  # Coverage targets for the minimum sufficient coalition (share of the anchors' demand).
  coverage_targets: [0.90, 0.95, 0.99]
  # Synthetic capacity one eligible member host may add in the coalition test.
  coalition_increment: 0.10
  # A compact of fewer countries than this is a bilateral arrangement, not a compact.
  min_countries: 3
  # A role is assigned when a member supplies at least this share of a node's restored supply.
  role_min_share: 0.05
  # Archetype: a class holding at least this share of the compact's lost supply sets it.
  archetype_dominance: 0.60
  # Every class holding at least this share keeps its instruments in key_policy_needs (and the
  # second one is reported as secondary_class).
  policy_need_floor: 0.20
  # A group is a compact only if its coalition improves the anchors' coverage over what their
  # existing relationships give them (fragmented action) by at least this much.
  min_compact_gain: 0.05
  # Leave-one-country-out: every non-member whose loss pushes a node below the 95% target is
  # reported; those supplying under this share of the anchors' demand in that node matter only
  # because the coalition sits near the target and are listed apart (`..._marginal`).
  critical_min_supply_share: 0.01
  # Seconds GLPK may spend on the robustness tie-break of each exact coalition (the minimum size
  # itself gets 20 times this); a solve that hits it keeps its best coalition found (reported).
  solver_time_limit: 10
  # Supply-chain coherence (needed, with partner and policy similarity, for two nodes to share a
  # compact): one node is upstream of the other within chain_max_hops links of supply_chain_links,
  # or (allow_co_inputs) both feed the same downstream node. A shared technology or stage is not
  # enough: wind foundations and permanent magnets are both Wind Midstream but not one chain.
  chain_max_hops: 3
  allow_co_inputs: true

# ---- Data-quality guardrails ----------------------------------------------------------------
data_quality:
  # Insufficient for optimization below any of these.
  min_world_trade_usd: 5.0e+7
  min_material_exporters: 3
  min_material_importers: 5
  # A material exporter/importer trades at least this much in the node (USD).
  material_flow_usd: 1.0e+6
  # Usable with caution at or above these.
  caution_mirror_share: 0.30
  caution_missing_rca_share: 0.20
  caution_nonessential_share: 0.50
  # Insufficient sub-sectors of one technology stage are merged into one aggregated node; an
  # aggregate that still fails stays out of the optimization (reported, not solved).
  aggregate_insufficient: true
