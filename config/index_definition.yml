# Component names only (documentation; the builders read weights from config/weights.yml).
partnership_strength:
  opportunity_components:
    - trade_index
    - econ_opp_index
    - partner_es_need
  friendshore_components:
    - imp_trade_index
    - econ_opp_raw
    - es_need
    - eo_partner
    - outbound_index
    - geo_alignment
  # Partner-level (no reporter dimension), non-high-income partners only.
  development_components:
    - development_index
    - doingbusiness_index
    - investment_enviro_index
    - energy_security
    - economic_opportunity
    - aid_index_supplychain
    - aidgdp_index_supplychain
    - energy_use_index

overall_variables:
  Overall Trade Index:
    category: "Trade"
    # EO export capability (export_feasibility). The net-import term is ES-only: it is
    # emitted by trade_concentration and scored in the Trade Risk overall below.
    components:
      - market_share
      - rca
      - export_size
      - feas
      - HHI
    aggregation: mean
    source: "Author calculation"
    explanation: "Author calculation across trade indices"
  Overall Trade Risk Index:
    category: "Trade"
    components:
      - HHI
      - market_share
      - deficit_gdp
    aggregation: mean
    source: "Author calculation"
    explanation: "Author calculation across trade risk indices"
  Overall Minerals Trade Index:
    category: "Minerals Trade"
    components:
      # mean(market share, HHI), demand-weighted across minerals, as the Technical Appendix
      # specifies; the theme used to compute both and keep only market share ("critmin_trade").
      # critmin_hhi is a world-market term, identical for every country within a tech.
      - "critmin_market_share"
      - "critmin_hhi"
    aggregation: mean
  Overall Foreign Dependency Index:
    category: "Foreign Dependency"
    components:
      - "Mineral Supply"
      - "Market Share"
      - "Overall Market Share"
      - "production"
      - "sales"
      - "import"
      - "market_share"
      - "Overall Production"
    aggregation: mean
  Overall Energy Imports Index:
    category: "Energy Imports"
    components:
      - "Production surplus/deficit"
    aggregation: mean
  Overall Reserves Index:
    category: "Reserves"
    components:
      - "Oil Reserves"
      - "Gas Reserves"
      - "Coal Reserves"
      - "Cobalt Reserves"
      - "Lithium Reserves"
      - "Graphite Reserves"
      - "Rare Earths Reserves"
      - "Copper Reserves"
      - "Manganese Reserves"
      - "Nickel Reserves"
      - "Zinc Reserves"
      - "PGMs Reserves"
      - "Solar Reserves"
      - "Wind Reserves"
      - "Electric Vehicles Reserves"
      - "Batteries Reserves"
      - "Electric Grid Reserves"
      - "Green Hydrogen Reserves"
      - "Heat Pumps Reserves"
      # Red Book identified recoverable uranium resources, <USD 260/kgU
      # (R/categories/reserves/uranium.R).
      - "Nuclear Reserves"
      - "Hydroelectric Power Reserves"
      - "Geothermal Reserves"
      - "Overall Solar PV Potential Index"
      - "Overall Wind Potential Index"
      - "Overall Geothermal Potential Index"
    aggregation: mean
  Overall Production Index:
    category: "Production"
    components:
      - "size"
      - "growth_abs"
      - "Overall Production"
      - "Cobalt Production"
      - "Lithium Production"
      - "Graphite Production"
      - "Rare Earths Production"
      - "Copper Production"
      - "Manganese Production"
      - "Nickel Production"
      - "Zinc Production"
      - "PGMs Production"
      - "Solar Production"
      - "Wind Production"
      - "Electric Vehicles Production"
      - "Batteries Production"
      - "Electric Grid Production"
      - "Green Hydrogen Production"
      - "Heat Pumps Production"
      - "Coal Production"
      # Red Book uranium mine production, latest year (Energy Security; the Economic
      # Opportunity side scores it as Nuclear Upstream size/growth_abs/Overall Production).
      - "Nuclear Production"
      - "Oil Production"
      - "Gas Production"
      - "Hydroelectric Power Production"
      - "Geothermal Production"
    aggregation: mean
  Overall Energy Access Index:
    category: "Energy Access"
    components:
      - "Energy consumption per capita"
      - "Energy consumption per capita growth"
    aggregation: mean
  Overall Consumption Index:
    category: "Consumption"
    components:
      - "Energy consumption per capita"
      - "Energy consumption per capita growth"
      - "installed_cap_index"
      - "elec_growth_index"
    aggregation: mean
  Overall Energy Prices Index:
    category: "Energy Prices"
    components:
      # The energy_prices theme's only index-scale variable (median_scurve of minus the
      # mean price volatility, so higher = more stable). The former "price_volatility"
      # matched nothing, so the category was never scored. It is a world-level series,
      # identical for every country within a tech: it shifts levels across techs but cannot
      # rank countries within a tech x stage cell.
      - "Overall Price Volatility Index"
    aggregation: mean
  Overall Technology Demand Index:
    category: "Technology Demand"
    components:
      # One vote per source, each already a composite of its own size and growth terms:
      # IEA WEO global demand, BNEF NEO regional demand (or, for EV Downstream, the IEA EV
      # Outlook index; both are named "Overall Demand"), BCG addressable market and BNEF
      # overcapacity. demand_size and demand_growth were listed beside the composites built
      # from them, which gave WEO half the category and overrode the 1:2 size:growth
      # weighting; the EV per-parameter names listed here were never emitted.
      - "Overall Global Demand"
      - "Overall Demand"
      - "Overall Addressable Market"
      - "Overall Overcapacity"
    aggregation: mean
  Overall Investment Index:
    category: "Investment"
    components:
      - "Annual Investment Index"
      - "Investment Momentum Index"
      - "Operating Capacity Index"
      - "Pipeline Capacity Index"
    aggregation: mean
    source: "GCIM / Rhodium + author normalization"
    explanation: "Mean of investment flow, momentum, and capacity pipeline indices"
  Overall Technological Readiness Index:
    category: "Technological Readiness"
    components:
      - "TRL Index"
    aggregation: mean
    source: "Author calculation"
    explanation: "Author calculation across technology readiness indices"
  Overall Input Cost Index:
    category: "Cost Competitiveness"
    components:
      # One vote per distinct input: BNEF LCOE (Downstream, ~30 markets), the ILO/IMF labour
      # and capital Input Cost Index, and the IEA relative equipment cost. "LCOE Index" is
      # the mean of the theme's current-year and 2050 LCOE indices; listing those two and
      # their mean (formerly "Overall input cost index") as well gave LCOE 3 of 4 votes.
      - "LCOE Index"
      - "Input Cost Index"
      - "IEA Cost index"
    aggregation: mean

