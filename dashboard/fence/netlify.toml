# Netlify settings for Draw the Fence, a site of its own (not the Allied Industrial Base Explorer).
# In the Netlify site settings, set the Base directory to `dashboard/fence`; everything else is read
# from this file. The build runs from the parent package, which holds the shared design system.
# The data (public/data/yards-fences/, written by scripts/89_export_yards_fences_data.R) must be in
# the repository for a build from git, or deploy a local build with the Netlify CLI.

[build]
  command = "cd .. && npm ci && npm run build:fence"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# a missing data file must 404, not fall through to the SPA
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404

# client-side routes (/, /assess, /result, ...) are served by the app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/yards-fences/*.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/yards-fences/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self' https://neiscenter.org https://*.neiscenter.org; base-uri 'self'; form-action 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
