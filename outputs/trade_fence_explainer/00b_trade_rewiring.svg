<text x='13.95' y='339.77' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='398.30px' lengthAdjust='spacingAndGlyphs'>abroad, or a smaller market. Technologies are their producing-stage HS6 baskets (overlapping); product groups are HS6 sets</text>
