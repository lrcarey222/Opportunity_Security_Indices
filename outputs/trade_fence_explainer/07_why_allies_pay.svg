<text x='138.50' y='125.02' style='font-size: 8.40px; font-family: "Roboto";' textLength='94.28px' lengthAdjust='spacingAndGlyphs'>All measures, 4 Dec 2026</text>
<text x='259.53' y='125.02' style='font-size: 8.40px; font-family: "Roboto";' textLength='151.88px' lengthAdjust='spacingAndGlyphs'>Without §232 (metals, autos, polysilicon)</text>
<text x='138.50' y='142.71' style='font-size: 8.40px; font-family: "Roboto";' textLength='50.34px' lengthAdjust='spacingAndGlyphs'>Without §301</text>
<text x='259.53' y='142.71' style='font-size: 8.40px; font-family: "Roboto";' textLength='86.70px' lengthAdjust='spacingAndGlyphs'>Without §338 (Canada)</text>
<text x='138.50' y='160.40' style='font-size: 8.40px; font-family: "Roboto";' textLength='61.79px' lengthAdjust='spacingAndGlyphs'>Without AD/CVD</text>
<text x='259.53' y='160.40' style='font-size: 8.40px; font-family: "Roboto";' textLength='57.96px' lengthAdjust='spacingAndGlyphs'>2024 duty rates</text>
<text x='13.95' y='56.94' style='font-size: 9.69px;fill: #374151; font-family: "Roboto";' textLength='400.37px' lengthAdjust='spacingAndGlyphs'>Trusted-partner Trade Restrictiveness Index on the statutory regime of 4 December 2026, and</text>
<text x='13.95' y='70.89' style='font-size: 9.69px;fill: #374151; font-family: "Roboto";' textLength='359.46px' lengthAdjust='spacingAndGlyphs'>with one authority switched off at a time. Without the Section 232 metals, autos and</text>
<text x='13.95' y='84.84' style='font-size: 9.69px;fill: #374151; font-family: "Roboto";' textLength='371.56px' lengthAdjust='spacingAndGlyphs'>polysilicon duties the index would fall by half or more in 5 of 6 cells. Section 338 duties</text>
<text x='13.95' y='98.80' style='font-size: 9.69px;fill: #374151; font-family: "Roboto";' textLength='371.15px' lengthAdjust='spacingAndGlyphs'>on Canada add a further 6-12 points in wind, solar and grid assembly since September.</text>
<text x='13.95' y='24.08' style='font-size: 14.25px; font-weight: bold;fill: #111827; font-family: "Roboto";' textLength='362.00px' lengthAdjust='spacingAndGlyphs'>Steel, aluminium and copper tariffs explain most of what</text>
<text x='13.95' y='42.03' style='font-size: 14.25px; font-weight: bold;fill: #111827; font-family: "Roboto";' textLength='310.95px' lengthAdjust='spacingAndGlyphs'>trusted partners pay for clean-energy equipment</text>
<text x='13.95' y='336.40' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='407.67px' lengthAdjust='spacingAndGlyphs'>Each scenario starts from observed August 2026 duty and adds the statutory change to 4 December modelled by the Trade War</text>
<text x='13.95' y='346.97' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='404.27px' lengthAdjust='spacingAndGlyphs'>Tracker tariff-action engine, re-run with every action of one authority removed (without Section 232, those goods become liable</text>
<text x='13.95' y='357.54' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='383.09px' lengthAdjust='spacingAndGlyphs'>to the Section 301 forced-labour duty, as they would be). No line falls below its 2024 rate. AD/CVD: all-others deposits in</text>
<text x='13.95' y='368.11' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='231.55px' lengthAdjust='spacingAndGlyphs'>force on 4 December, capped at 100%. 2024 duty rates exclude AD/CVD.</text>
<text x='13.95' y='378.68' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='406.79px' lengthAdjust='spacingAndGlyphs'>Grey tick: observed August 2026 (Census duty plus AD/CVD). Section 338: the tracker's Canada basket was checked line by line</text>
<text x='13.95' y='389.25' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='390.43px' lengthAdjust='spacingAndGlyphs'>against HTSUS Revision 23 (2026), chapter 99 U.S. note 51(b)(3) (all 591 codes listed, incl. 7308.90 structures, 8537.10.91</text>
<text x='13.95' y='399.82' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='391.75px' lengthAdjust='spacingAndGlyphs'>switchgear, 8544.49.30 conductors); note 51(c) makes the duty stack on Section 232. The 338 effect is modelled (after the</text>
<text x='13.95' y='410.39' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='303.03px' lengthAdjust='spacingAndGlyphs'>latest Census month), so it is shown as a secondary result. A pure-engine version is in the CSV.</text>
<text x='13.95' y='420.96' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='371.84px' lengthAdjust='spacingAndGlyphs'>Trade Restrictiveness Index: the uniform tariff with the same welfare cost as the actual tariffs (not an average tariff).</text>
<text x='13.95' y='431.53' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='417.12px' lengthAdjust='spacingAndGlyphs'>Source: NEIS analysis using the Trade War Tracker engine (github.com/tradewartracker/trade-war-redux-2025), US Census Bureau,</text>
<text x='13.95' y='442.10' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='53.94px' lengthAdjust='spacingAndGlyphs'>Federal Register.</text>
