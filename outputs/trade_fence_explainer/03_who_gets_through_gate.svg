<text x='13.95' y='373.93' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='422.07px' lengthAdjust='spacingAndGlyphs'>Sources: US Census Bureau (via the Trade War Tracker); UN Comtrade 2024 US goods trade by partner; UN General Assembly voting</text>
