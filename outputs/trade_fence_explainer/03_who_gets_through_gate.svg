<text x='13.95' y='342.22' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='388.07px' lengthAdjust='spacingAndGlyphs'>Supplier groups (NEIS posture engine): trusted = US-leaning UN-voting bloc (incl. EU, UK, Japan, Korea, Canada, Australia);</text>
<text x='13.95' y='352.79' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='413.70px' lengthAdjust='spacingAndGlyphs'>coercive = China, Hong Kong, Macao, Russia and the China-leaning UN-voting bloc (incl. Vietnam and Indonesia); nonaligned = the</text>
