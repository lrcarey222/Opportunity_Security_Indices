<text x='13.95' y='221.20' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='388.72px' lengthAdjust='spacingAndGlyphs'>Statutory regime of 4 December 2026 (observed rates plus statutory changes since mid-August, modelled): trusted 14.0%,</text>
<text x='13.95' y='231.77' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='215.38px' lengthAdjust='spacingAndGlyphs'>nonaligned 12.0%, coercive 24.9%, China 28.4%, all suppliers 16.3%.</text>
<text x='13.95' y='242.34' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='416.87px' lengthAdjust='spacingAndGlyphs'>Observed rates are Census calculated duty / customs value; AD/CVD deposits are not in Census duty and are excluded here. Trade</text>
<text x='13.95' y='252.91' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='391.01px' lengthAdjust='spacingAndGlyphs'>Restrictiveness Index (Waugh): the uniform tariff with the same welfare cost as the actual tariff structure, sqrt(sum w*t^2 /</text>
<text x='13.95' y='263.48' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='367.29px' lengthAdjust='spacingAndGlyphs'>sum w) on 2024 import weights. It rises with dispersion as well as level; it is not an average tariff and should not be</text>
<text x='13.95' y='274.05' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='134.65px' lengthAdjust='spacingAndGlyphs'>multiplied by imports to estimate revenue.</text>
<text x='13.95' y='284.62' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='388.07px' lengthAdjust='spacingAndGlyphs'>Supplier groups (NEIS posture engine): trusted = US-leaning UN-voting bloc (incl. EU, UK, Japan, Korea, Canada, Australia);</text>
<text x='13.95' y='295.19' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='413.70px' lengthAdjust='spacingAndGlyphs'>coercive = China, Hong Kong, Macao, Russia and the China-leaning UN-voting bloc (incl. Vietnam and Indonesia); nonaligned = the</text>
<text x='13.95' y='305.76' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='243.86px' lengthAdjust='spacingAndGlyphs'>rest (incl. Mexico, India, Taiwan, Thailand, Malaysia, Singapore, Switzerland).</text>
<text x='13.95' y='316.33' style='font-size: 7.22px;fill: #6B7280; font-family: "Roboto";' textLength='416.80px' lengthAdjust='spacingAndGlyphs'>Source: NEIS analysis of US Census Bureau imports for consumption and calculated duty by HTS-10 line and partner (via the Trade</text>
